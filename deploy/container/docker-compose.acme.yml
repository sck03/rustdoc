services:
  web:
    command:
      - /bin/sh
      - -c
      - >-
        (while :; do sleep 3600; nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    ports:
      - "${EXPORTDOCMANAGER_WEB_BIND_ADDRESS:-0.0.0.0}:${EXPORTDOCMANAGER_HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx.acme.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/letsencrypt:/etc/letsencrypt:ro
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/acme-webroot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        set -eu;
        grant_web_certificate_access() {
          for directory in
            /etc/letsencrypt
            /etc/letsencrypt/live
            /etc/letsencrypt/live/exportdocmanager
            /etc/letsencrypt/archive
            /etc/letsencrypt/archive/exportdocmanager;
          do
            if [ -d "$$directory" ]; then
              chown 0:101 "$$directory";
              chmod 0750 "$$directory";
            fi;
          done;
          for certificate_file in /etc/letsencrypt/archive/exportdocmanager/*.pem; do
            if [ -f "$$certificate_file" ]; then
              chown 0:101 "$$certificate_file";
              chmod 0640 "$$certificate_file";
            fi;
          done;
        };
        grant_web_certificate_access;
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet || true;
          grant_web_certificate_access;
          sleep 43200;
        done
    depends_on:
      web:
        condition: service_started
    volumes:
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/letsencrypt:/etc/letsencrypt
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/acme-webroot:/var/www/certbot
