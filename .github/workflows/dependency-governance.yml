name: Dependency security and SBOM governance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "scripts/generate-dependency-governance.mjs"
      - "scripts/verify-dependency-policy.mjs"
      - "scripts/test_dependency_policy.mjs"
      - "scripts/verify-github-workflow-actions.mjs"
      - ".github/workflows/dependency-governance.yml"
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "scripts/generate-dependency-governance.mjs"
      - "scripts/verify-dependency-policy.mjs"
      - "scripts/test_dependency_policy.mjs"
      - "scripts/verify-github-workflow-actions.mjs"
      - ".github/workflows/dependency-governance.yml"

concurrency:
  group: dependency-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/artifacts/cargo-home

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/export-doc-web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.1

      - name: Restore locked dependency graphs
        run: |
          npm ci --prefix apps/export-doc-web
          npm ci --prefix apps/export-doc-tauri
          cargo fetch --locked
          cargo fetch --locked --manifest-path apps/exportdoc-ocr-rs/Cargo.toml
          cargo fetch --locked --manifest-path tools/excel-analyzer-rs/Cargo.toml

      - name: Validate Node 24 and artifact Action policy
        run: node scripts/verify-github-workflow-actions.mjs

      - name: Verify exact dependency policy pins
        run: node scripts/verify-dependency-policy.mjs

      - name: Run dependency policy regression tests
        run: node scripts/test_dependency_policy.mjs

      - name: Audit npm production dependencies
        run: npm --prefix apps/export-doc-web run audit:production

      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked --root "$CARGO_HOME"

      - name: Audit Rust lock files
        run: |
          "$CARGO_HOME/bin/cargo-audit" audit --deny unsound --deny yanked --file Cargo.lock
          "$CARGO_HOME/bin/cargo-audit" audit --deny unsound --deny yanked --file apps/exportdoc-ocr-rs/Cargo.lock
          "$CARGO_HOME/bin/cargo-audit" audit --deny unsound --deny yanked --file tools/excel-analyzer-rs/Cargo.lock

      - name: Generate SPDX, CycloneDX and third-party inventory
        run: node scripts/generate-dependency-governance.mjs artifacts/dependency-governance --release --verify-repository

      - name: Recheck generated dependency evidence
        run: node scripts/verify-dependency-policy.mjs --generated-only

      - name: Upload dependency governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-governance
          path: artifacts/dependency-governance
          if-no-files-found: warn
          retention-days: 30
