[package]
name = "export-doc-mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native MIME, SMTP and safe email template rendering"

[dependencies]
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "macros"] }
scraper = { version = "=0.27.0", default-features = false }
ego-tree = "=0.11.0"
url = "=2.5.8"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
zeroize = "=1.9.0"

[lints]
workspace = true
