name: Container runtime lifecycle validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.Config"
      - "version.json"
      - "THIRD_PARTY_DEPENDENCIES.md"
      - "THIRD_PARTY_NOTICES.md"
      - "deploy/container/**"
      - "src/**"
      - "Shared/**"
      - "Templates/**"
      - "Resources/**"
      - "OcrModels/**"
      - "scripts/provision-report-fonts.mjs"
      - "scripts/verify-font-license-policy.mjs"
      - "scripts/github/verify-public-source.ps1"
      - "apps/export-doc-web/**"
      - "apps/exportdoc-ocr-rs/**"
      - "tools/excel-analyzer-rs/**"
      - ".github/workflows/container-runtime-validation.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.Config"
      - "version.json"
      - "THIRD_PARTY_DEPENDENCIES.md"
      - "THIRD_PARTY_NOTICES.md"
      - "deploy/container/**"
      - "src/**"
      - "Shared/**"
      - "Templates/**"
      - "Resources/**"
      - "OcrModels/**"
      - "scripts/provision-report-fonts.mjs"
      - "scripts/verify-font-license-policy.mjs"
      - "scripts/github/verify-public-source.ps1"
      - "apps/export-doc-web/**"
      - "apps/exportdoc-ocr-rs/**"
      - "tools/excel-analyzer-rs/**"
      - ".github/workflows/container-runtime-validation.yml"

concurrency:
  group: container-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_DIRECTORY: deploy/container
      EXPORTDOCMANAGER_WEB_PORT: "18080"
      EXPORTDOCMANAGER_WEB_BIND_ADDRESS: "127.0.0.1"
      EXPORTDOCMANAGER_HTTPS_PORT: "18443"
      POSTGRES_DB: exportdoc
      POSTGRES_USER: exportdoc

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify public repository boundary
        shell: pwsh
        run: ./scripts/github/verify-public-source.ps1

      - name: Validate Linux one-command installer
        shell: bash
        run: |
          bash -n deploy/container/install-container.sh
          sh -n deploy/container/postgres-init-roles.sh
          sh -n deploy/container/start-browser-runtime.sh
          bash deploy/container/install-container.sh --help >/dev/null

          installer_root="${{ runner.temp }}/container-installer-test"
          sudo env EXPORTDOCMANAGER_DEPLOYMENT_ASSET_BASE="file://${{ github.workspace }}/deploy/container" \
            bash deploy/container/install-container.sh \
            --mode http \
            --tag validation \
            --revision "$GITHUB_SHA" \
            --web-port 18080 \
            --install-dir "$installer_root" \
            --no-start
          first_password="$(sudo sed -n 's/^POSTGRES_PASSWORD=//p' "$installer_root/.env")"
          first_app_password="$(sudo sed -n 's/^EXPORTDOCMANAGER_POSTGRES_APP_PASSWORD=//p' "$installer_root/.env")"
          first_maintenance_password="$(sudo sed -n 's/^EXPORTDOCMANAGER_POSTGRES_MAINTENANCE_PASSWORD=//p' "$installer_root/.env")"
          first_token="$(sudo sed -n 's/^EXPORTDOCMANAGER_BOOTSTRAP_TOKEN=//p' "$installer_root/.env")"

          sudo env EXPORTDOCMANAGER_DEPLOYMENT_ASSET_BASE="file://${{ github.workspace }}/deploy/container" \
            bash "$installer_root/install-container.sh" \
            --mode http \
            --install-dir "$installer_root" \
            --no-start
          test "$first_password" = "$(sudo sed -n 's/^POSTGRES_PASSWORD=//p' "$installer_root/.env")"
          test "$first_app_password" = "$(sudo sed -n 's/^EXPORTDOCMANAGER_POSTGRES_APP_PASSWORD=//p' "$installer_root/.env")"
          test "$first_maintenance_password" = "$(sudo sed -n 's/^EXPORTDOCMANAGER_POSTGRES_MAINTENANCE_PASSWORD=//p' "$installer_root/.env")"
          test "$first_token" = "$(sudo sed -n 's/^EXPORTDOCMANAGER_BOOTSTRAP_TOKEN=//p' "$installer_root/.env")"
          test "$(sudo sed -n 's/^EXPORTDOCMANAGER_IMAGE_TAG=//p' "$installer_root/.env")" = "validation"
          test "$(sudo sed -n 's/^EXPORTDOCMANAGER_WEB_PORT=//p' "$installer_root/.env")" = "18080"
          test "$(sudo sed -n 's/^EXPORTDOCMANAGER_WEB_BIND_ADDRESS=//p' "$installer_root/.env")" = "127.0.0.1"

          sudo env EXPORTDOCMANAGER_DEPLOYMENT_ASSET_BASE="file://${{ github.workspace }}/deploy/container" \
            bash "$installer_root/install-container.sh" \
            --mode https \
            --domain docs.example.com \
            --email ops@example.com \
            --install-dir "$installer_root" \
            --no-start
          test "$(sudo sed -n 's/^EXPORTDOCMANAGER_DEPLOYMENT_MODE=//p' "$installer_root/.env")" = "https"
          test "$(sudo sed -n 's/^EXPORTDOCMANAGER_WEB_PORT=//p' "$installer_root/.env")" = "80"
          test "$(sudo sed -n 's/^EXPORTDOCMANAGER_WEB_BIND_ADDRESS=//p' "$installer_root/.env")" = "0.0.0.0"

          sudo env EXPORTDOCMANAGER_DEPLOYMENT_ASSET_BASE="file://${{ github.workspace }}/deploy/container" \
            bash "$installer_root/install-container.sh" \
            --mode http \
            --web-port 18080 \
            --install-dir "$installer_root" \
            --no-start
          test "$first_password" = "$(sudo sed -n 's/^POSTGRES_PASSWORD=//p' "$installer_root/.env")"
          test "$first_app_password" = "$(sudo sed -n 's/^EXPORTDOCMANAGER_POSTGRES_APP_PASSWORD=//p' "$installer_root/.env")"
          test "$first_maintenance_password" = "$(sudo sed -n 's/^EXPORTDOCMANAGER_POSTGRES_MAINTENANCE_PASSWORD=//p' "$installer_root/.env")"
          test "$first_token" = "$(sudo sed -n 's/^EXPORTDOCMANAGER_BOOTSTRAP_TOKEN=//p' "$installer_root/.env")"
          test "$(sudo sed -n 's/^EXPORTDOCMANAGER_DEPLOYMENT_MODE=//p' "$installer_root/.env")" = "http"
          test "$(sudo sed -n 's/^EXPORTDOCMANAGER_ALLOW_INSECURE_DISASTER_RECOVERY=//p' "$installer_root/.env")" = "false"
          test "$(sudo find "$installer_root" -maxdepth 1 -name '.env.previous.*' -print -quit)" = ""

          rollback_assets="${{ runner.temp }}/container-installer-rollback-assets"
          rollback_root="${{ runner.temp }}/container-installer-rollback-root"
          mkdir -p "$rollback_assets"
          mkdir -p "$rollback_root"
          cp deploy/container/docker-compose.ghcr.yml "$rollback_assets/"
          cp deploy/container/docker-compose.acme.yml "$rollback_assets/"
          cp deploy/container/nginx.acme.conf "$rollback_assets/"
          cp deploy/container/postgres-init-roles.sh "$rollback_assets/"
          cp deploy/container/install-container.sh "$rollback_assets/"
          cp deploy/container/deployment-assets.sha256 "$rollback_assets/"
          printf 'services: [\n' > "$rollback_assets/docker-compose.ghcr.yml"
          printf '# previous environment\n' > "$rollback_root/.env"
          printf '# previous compose\n' > "$rollback_root/docker-compose.ghcr.yml"
          previous_env_hash="$(sha256sum "$rollback_root/.env" | awk '{print $1}')"
          previous_compose_hash="$(sha256sum "$rollback_root/docker-compose.ghcr.yml" | awk '{print $1}')"
          if sudo env EXPORTDOCMANAGER_DEPLOYMENT_ASSET_BASE="file://$rollback_assets" \
              bash deploy/container/install-container.sh \
              --mode http \
              --tag validation \
              --revision "$GITHUB_SHA" \
              --install-dir "$rollback_root" \
              --no-start; then
            echo "Installer rollback probe unexpectedly succeeded." >&2
            exit 1
          fi
          test "$previous_env_hash" = "$(sudo sha256sum "$rollback_root/.env" | awk '{print $1}')"
          test "$previous_compose_hash" = "$(sudo sha256sum "$rollback_root/docker-compose.ghcr.yml" | awk '{print $1}')"
          test "$(sudo find "$rollback_root" -maxdepth 1 \( -name '.deployment-assets.*' -o -name '.env.previous.*' \) -print -quit)" = ""

          symlink_install_target="${{ runner.temp }}/container-installer-symlink-target"
          symlink_install_path="${{ runner.temp }}/container-installer-symlink-root"
          mkdir -p "$symlink_install_target"
          ln -s "$symlink_install_target" "$symlink_install_path"
          if sudo env EXPORTDOCMANAGER_DEPLOYMENT_ASSET_BASE="file://${{ github.workspace }}/deploy/container" \
              bash deploy/container/install-container.sh \
              --mode http \
              --tag validation \
              --revision "$GITHUB_SHA" \
              --install-dir "$symlink_install_path" \
              --no-start; then
            echo "Installer unexpectedly accepted a symlink installation root." >&2
            exit 1
          fi
          test "$(find "$symlink_install_target" -mindepth 1 -print -quit)" = ""

          symlink_runtime_root="${{ runner.temp }}/container-installer-symlink-runtime-root"
          symlink_runtime_target="${{ runner.temp }}/container-installer-symlink-runtime-target"
          mkdir -p "$symlink_runtime_root" "$symlink_runtime_target"
          ln -s "$symlink_runtime_target" "$symlink_runtime_root/runtime"
          printf 'EXPORTDOCMANAGER_DEPLOYMENT_MODE=http\nEXPORTDOCMANAGER_RUNTIME_ROOT=%s/runtime\n' \
            "$symlink_runtime_root" > "$symlink_runtime_root/.env"
          printf '# previous compose marker\n' > "$symlink_runtime_root/docker-compose.ghcr.yml"
          symlink_previous_env_hash="$(sha256sum "$symlink_runtime_root/.env" | awk '{print $1}')"
          symlink_previous_compose_hash="$(sha256sum "$symlink_runtime_root/docker-compose.ghcr.yml" | awk '{print $1}')"
          if sudo env EXPORTDOCMANAGER_DEPLOYMENT_ASSET_BASE="file://${{ github.workspace }}/deploy/container" \
              bash deploy/container/install-container.sh \
              --mode http \
              --tag validation \
              --revision "$GITHUB_SHA" \
              --install-dir "$symlink_runtime_root" \
              --no-start; then
            echo "Installer unexpectedly accepted a symlink runtime root." >&2
            exit 1
          fi
          test "$(find "$symlink_runtime_target" -mindepth 1 -print -quit)" = ""
          test "$symlink_previous_env_hash" = "$(sudo sha256sum "$symlink_runtime_root/.env" | awk '{print $1}')"
          test "$symlink_previous_compose_hash" = "$(sudo sha256sum "$symlink_runtime_root/docker-compose.ghcr.yml" | awk '{print $1}')"
          sudo test ! -e "$symlink_runtime_root/docker-compose.acme.yml"
          sudo test ! -e "$symlink_runtime_root/nginx.acme.conf"
          sudo test ! -e "$symlink_runtime_root/postgres-init-roles.sh"
          sudo test ! -e "$symlink_runtime_root/install-container.sh"
          test "$(sudo find "$symlink_runtime_root" -maxdepth 1 \( -name '.deployment-assets.*' -o -name '.env.previous.*' \) -print -quit)" = ""

          sudo test -f "$installer_root/runtime/api-data/Config/appsettings.json"
          test "$(sudo stat -c '%a' "$installer_root")" = "700"
          test "$(sudo stat -c '%a' "$installer_root/.env")" = "600"
          test "$(sudo stat -c '%a' "$installer_root/runtime")" = "700"
          test "$(sudo stat -c '%a' "$installer_root/runtime/postgres")" = "700"
          test "$(sudo stat -c '%u:%g' "$installer_root/runtime/postgres")" = "999:999"
          test "$(sudo stat -c '%a' "$installer_root/runtime/api-data")" = "750"
          test "$(sudo stat -c '%u:%g' "$installer_root/runtime/api-data")" = "10001:10001"
          test "$(sudo stat -c '%a' "$installer_root/runtime/api-data/Config")" = "750"
          test "$(sudo stat -c '%a' "$installer_root/runtime/api-data/Config/appsettings.json")" = "600"
          test "$(sudo stat -c '%u:%g' "$installer_root/runtime/api-data/Config/appsettings.json")" = "10001:10001"
          sudo test -d "$installer_root/runtime/api-data/Cache/ReportPdf"
          test "$(sudo stat -c '%u:%g' "$installer_root/runtime/api-data/Cache/ReportPdf")" = "10001:10001"
          test "$(sudo stat -c '%a' "$installer_root/runtime/api-data/Cache/ReportPdf")" = "750"
          sudo test -d "$installer_root/runtime/browser"
          test "$(sudo stat -c '%u:%g' "$installer_root/runtime/browser")" = "10001:10001"
          test "$(sudo stat -c '%a' "$installer_root/runtime/browser")" = "750"

          postgres_probe="exportdoc-installer-postgres-${{ github.run_id }}"
          cleanup_installer_probe() {
            sudo docker rm -f "$postgres_probe" >/dev/null 2>&1 || true
          }
          trap cleanup_installer_probe EXIT
          sudo docker run --detach --name "$postgres_probe" \
            --user 999:999 \
            --env POSTGRES_DB=exportdoc \
            --env POSTGRES_USER=exportdoc \
            --env POSTGRES_PASSWORD=container-installer-db-validation \
            --env 'POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale-provider=builtin --builtin-locale=PG_UNICODE_FAST' \
            --volume "$installer_root/runtime/postgres:/var/lib/postgresql" \
            postgres:18.4-trixie >/dev/null
          for attempt in $(seq 1 60); do
            if sudo docker exec "$postgres_probe" pg_isready -U exportdoc -d exportdoc >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              sudo docker logs "$postgres_probe" >&2 || true
              exit 1
            fi
            sleep 2
          done
          sudo docker rm -f "$postgres_probe" >/dev/null
          sudo docker run --rm \
            --user 10001:10001 \
            --entrypoint sh \
            --volume "$installer_root/runtime/api-data:/runtime-data" \
            postgres:18.4-trixie \
            -ec 'test -r /runtime-data/Config/appsettings.json; probe=/runtime-data/Config/.write-probe-$$; printf ok > "$probe"; mv "$probe" "${probe}.done"; rm "${probe}.done"'
          trap - EXIT
          sudo chown -R "$(id -u):$(id -g)" "$installer_root"

      - name: Initialize isolated runtime directory
        shell: pwsh
        run: |
          sudo pwsh -NoProfile -File ./deploy/container/initialize-container-runtime.ps1 `
            -RuntimeRoot "${{ github.workspace }}/artifacts/container-runtime/live" `
            -PostgreSqlPassword "container-validation-db-2026" `
            -BootstrapToken "container-validation-bootstrap-token-2026" `
            -WebPort $env:EXPORTDOCMANAGER_WEB_PORT `
            -HttpsPort $env:EXPORTDOCMANAGER_HTTPS_PORT
          sudo chown "$(id -u):$(id -g)" ./deploy/container/.env "${{ github.workspace }}/artifacts/container-runtime"
          chmod 600 ./deploy/container/.env

      - name: Create CI-only TLS certificate
        shell: bash
        run: |
          mkdir -p deploy/container/secrets/tls artifacts/container-runtime/evidence
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            -keyout deploy/container/secrets/tls/server.key \
            -out deploy/container/secrets/tls/server.crt
          sudo chown "$(id -u):101" \
            deploy/container/secrets/tls/server.key \
            deploy/container/secrets/tls/server.crt
          chmod 0640 \
            deploy/container/secrets/tls/server.key \
            deploy/container/secrets/tls/server.crt

      - name: Validate HTTP and HTTPS Compose models
        working-directory: deploy/container
        shell: bash
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
          static_https_config="$(docker compose -f docker-compose.yml -f docker-compose.https.yml config)"
          grep -q 'target: 8443' <<<"$static_https_config"
          if grep -q 'target: 8080' <<<"$static_https_config"; then
            echo "Static-certificate HTTPS mode must not publish the cleartext web listener." >&2
            exit 1
          fi
          EXPORTDOCMANAGER_IMAGE_NAMESPACE=ghcr.io/sck03 \
            EXPORTDOCMANAGER_IMAGE_TAG=validation \
            docker compose -f docker-compose.ghcr.yml config --quiet
          EXPORTDOCMANAGER_IMAGE_NAMESPACE=ghcr.io/sck03 \
            EXPORTDOCMANAGER_IMAGE_TAG=validation \
            docker compose -f docker-compose.ghcr.yml -f docker-compose.acme.yml config --quiet

      - name: Validate automatic HTTPS Nginx configuration
        working-directory: deploy/container
        shell: bash
        run: |
          certificate_root="${{ github.workspace }}/artifacts/container-runtime/acme-config-test/letsencrypt"
          mkdir -p "$certificate_root/live/exportdocmanager" "${{ github.workspace }}/artifacts/container-runtime/acme-config-test/webroot"
          cp secrets/tls/server.crt "$certificate_root/live/exportdocmanager/fullchain.pem"
          cp secrets/tls/server.key "$certificate_root/live/exportdocmanager/privkey.pem"
          docker run --rm \
            --add-host api:127.0.0.1 \
            --volume "${{ github.workspace }}/deploy/container/nginx.acme.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$certificate_root:/etc/letsencrypt:ro" \
            --volume "${{ github.workspace }}/artifacts/container-runtime/acme-config-test/webroot:/var/www/certbot:ro" \
            nginx:1.30.4-alpine3.24 nginx -t

      - name: Build HTTP images and validate API OCR runtime
        working-directory: deploy/container
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          build_log="../../artifacts/container-runtime/evidence/container-build.log"
          mkdir -p "$(dirname "$build_log")"

          if docker compose build --progress=plain 2>&1 | tee "$build_log"; then
            exec bash ./verify-api-ocr-runtime.sh
          fi

          echo "::group::Container build failure tail"
          tail -n 120 "$build_log" || true
          echo "::endgroup::"

          diagnostic="$(tail -n 40 "$build_log" || true)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Container image build failed::$diagnostic"
          exit 1

      - name: Start HTTP stack
        working-directory: deploy/container
        shell: bash
        timeout-minutes: 5
        run: |
          if ! docker compose up -d --no-build; then
            startup_log="../../artifacts/container-runtime/evidence/container-startup.log"
            {
              echo "Container stack failed to reach its declared startup dependencies."
              docker compose ps --all || true
              docker compose logs --no-color --tail=200 postgres browser api web || true
              api_container_id="$(docker compose ps -q api)"
              if [ -n "$api_container_id" ]; then
                docker inspect --format '{{json .State.Health}}' "$api_container_id" || true
              fi
            } 2>&1 | tee "$startup_log" >&2

            diagnostic="$(tail -n 80 "$startup_log" || true)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Container stack startup failed::$diagnostic"
            exit 1
          fi

      - name: Wait for readiness and health endpoints
        working-directory: deploy/container
        shell: bash
        run: |
          show_diagnostics() {
            docker compose ps --all || true
            docker compose logs --no-color --tail=200 postgres browser api web || true
            api_container_id="$(docker compose ps -q api)"
            if [ -n "$api_container_id" ]; then
              docker inspect --format '{{json .State.Health}}' "$api_container_id" || true
            fi
          }

          ready=0
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 3 --fail --silent \
              "http://127.0.0.1:${EXPORTDOCMANAGER_WEB_PORT}/readyz" \
              > ../../artifacts/container-runtime/evidence/readyz.json; then
              ready=1
              break
            fi

            api_container_id="$(docker compose ps -q api)"
            if [ -z "$api_container_id" ]; then
              echo "API container was not created." >&2
              show_diagnostics
              exit 1
            fi

            api_status="$(docker inspect --format '{{.State.Status}}' "$api_container_id" 2>/dev/null || true)"
            api_restarts="$(docker inspect --format '{{.RestartCount}}' "$api_container_id" 2>/dev/null || echo 0)"
            api_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$api_container_id" 2>/dev/null || true)"
            if [ "$api_status" != "running" ] || [ "${api_restarts:-0}" -gt 0 ] || [ "$api_health" = "unhealthy" ]; then
              echo "API container is not stable: status=${api_status:-unknown}, health=${api_health:-unknown}, restarts=${api_restarts:-unknown}." >&2
              show_diagnostics
              exit 1
            fi

            if [ $((attempt % 5)) -eq 0 ]; then
              echo "Readiness attempt ${attempt}/30: API status=${api_status}, health=${api_health}, restarts=${api_restarts}."
              docker compose ps --all
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Container readiness timed out after bounded retries." >&2
            show_diagnostics
            exit 1
          fi

          jq -e '.status == "ready" and .checks.database == "ready" and .checks.runtimeDirectories == "ready" and .checks.browser == "ready"' \
            ../../artifacts/container-runtime/evidence/readyz.json >/dev/null
          curl --connect-timeout 2 --max-time 3 --fail --silent --show-error \
            "http://127.0.0.1:${EXPORTDOCMANAGER_WEB_PORT}/livez" \
            > ../../artifacts/container-runtime/evidence/livez.json
          jq -e '.status == "alive"' ../../artifacts/container-runtime/evidence/livez.json >/dev/null

          health_ready=0
          for attempt in $(seq 1 3); do
            if curl --connect-timeout 2 --max-time 3 --fail --silent --show-error \
              "http://127.0.0.1:${EXPORTDOCMANAGER_WEB_PORT}/healthz" \
              > ../../artifacts/container-runtime/evidence/healthz.json; then
              health_ready=1
              break
            fi
            echo "Public health attempt ${attempt}/3 did not complete within the bounded timeout." >&2
            sleep 2
          done

          if [ "$health_ready" -ne 1 ]; then
            echo "Public health endpoint did not respond through the Web reverse proxy." >&2
            echo "Direct API probe (diagnostic only):" >&2
            docker compose exec -T api \
              curl --connect-timeout 2 --max-time 3 --fail --silent --show-error \
              http://127.0.0.1:5188/healthz >&2 || true
            show_diagnostics
            exit 1
          fi

          login_status="$(curl --connect-timeout 2 --max-time 10 --silent --show-error \
            --output ../../artifacts/container-runtime/evidence/login-validation.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"username":"","password":""}' \
            "http://127.0.0.1:${EXPORTDOCMANAGER_WEB_PORT}/api/auth/login")"
          if [ "$login_status" != "400" ]; then
            echo "Anonymous login validation returned HTTP $login_status instead of 400." >&2
            cat ../../artifacts/container-runtime/evidence/login-validation.json >&2 || true
            show_diagnostics
            exit 1
          fi

      - name: Validate writable runtime configuration boundary
        working-directory: deploy/container
        shell: bash
        run: |
          docker compose exec -T api sh -eu -c '
            test "$(id -u):$(id -g)" = "10001:10001"
            test -d /runtime-data/Config
            test -f /runtime-data/Config/appsettings.json
            test -w /runtime-data/Config
            test -w /runtime-data/Config/appsettings.json
            probe="/runtime-data/Config/.settings-write-probe-$$"
            printf "%s\n" "runtime-config-write-ok" > "$probe"
            mv "$probe" "${probe}.committed"
            test "$(cat "${probe}.committed")" = "runtime-config-write-ok"
            rm -f "${probe}.committed"
          '

      - name: Validate isolated Chromium PDF runtime and capability boundary
        working-directory: deploy/container
        shell: bash
        run: |
          set -o pipefail
          chromium_log="../../artifacts/container-runtime/evidence/chromium-runtime.log"
          if {
            set -eu
            api_container_id="$(docker compose ps -q api)"
            browser_container_id="$(docker compose ps -q browser)"
            test -n "$api_container_id" && test -n "$browser_container_id"
            docker inspect --format '{{json .HostConfig.CapAdd}}' "$browser_container_id" \
              > ../../artifacts/container-runtime/evidence/browser-container-capabilities.json
            jq -e 'map(ascii_upcase) | index("SYS_ADMIN") != null' \
              ../../artifacts/container-runtime/evidence/browser-container-capabilities.json \
              >/dev/null
            docker inspect --format '{{json .HostConfig.CapAdd}}' "$api_container_id" \
              > ../../artifacts/container-runtime/evidence/api-container-capabilities.json
            jq -e '(. // []) | map(ascii_upcase) | index("SYS_ADMIN") == null' \
              ../../artifacts/container-runtime/evidence/api-container-capabilities.json \
              >/dev/null
            docker compose exec -T browser /usr/bin/chromium --version \
              > ../../artifacts/container-runtime/evidence/chromium-version.txt
            docker compose exec -T browser df -B1 /dev/shm \
              > ../../artifacts/container-runtime/evidence/chromium-shared-memory.txt
            docker compose exec -T browser sh -eux -c '
              test -u /usr/lib/chromium/chrome-sandbox
              shm_bytes="$(df -B1 --output=size /dev/shm | tail -n 1 | tr -d " ")"
              test "$shm_bytes" -ge 500000000
              test -n "$(curl --fail --silent http://127.0.0.1:9223/json/version)"
              test -n "$(curl --fail --silent http://127.0.0.1:9222/json/version)"
              probe_root="$(mktemp -d /browser-data/chromium-validation.XXXXXX)"
              cleanup() {
                rm -rf "$probe_root"
              }
              trap cleanup EXIT INT TERM
              if ! timeout 45s /usr/bin/chromium \
                --headless=new \
                --disable-background-networking \
                --disable-default-apps \
                --disable-extensions \
                --disable-sync \
                --no-first-run \
                --no-default-browser-check \
                --user-data-dir="$probe_root/profile" \
                --print-to-pdf="$probe_root/probe.pdf" \
                "data:text/html;charset=utf-8,<html><body><h1>ExportDocManager Chromium PDF</h1><p>Debian 13 runtime validation</p></body></html>" \
                > "$probe_root/chromium.log" 2>&1; then
                cat "$probe_root/chromium.log" >&2
                exit 1
              fi
              test -s "$probe_root/probe.pdf"
              test "$(head -c 5 "$probe_root/probe.pdf")" = "%PDF-"
              test "$(stat -c "%s" "$probe_root/probe.pdf")" -gt 1000
            '
            browser_env="$(docker inspect --format '{{json .Config.Env}}' "$browser_container_id")"
            jq -e 'map(select(test("(?i)(POSTGRES|DATABASE|MAINTENANCE|BOOTSTRAP|MASTER_KEY|PASSWORD)"))) | length == 0' \
              <<<"$browser_env" >/dev/null
            api_env="$(docker inspect --format '{{json .Config.Env}}' "$api_container_id")"
            jq -e 'map(select(startswith("EXPORTDOCMANAGER_BROWSER_CDP_ENDPOINT=http://browser:9222"))) | length == 1' \
              <<<"$api_env" >/dev/null
            docker compose exec -T api sh -ec 'test ! -e /usr/bin/chromium'
            browser_networks="$(docker inspect --format '{{json .NetworkSettings.Networks}}' "$browser_container_id")"
            jq -e 'keys | any(contains("backend")) | not' <<<"$browser_networks" >/dev/null
          } 2>&1 | tee "$chromium_log"; then
            exit 0
          fi

          diagnostic="$(tail -n 80 "$chromium_log" || true)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Isolated Chromium PDF validation failed::$diagnostic"
          exit 1

      - name: Validate API remote CDP PDF bridge
        working-directory: deploy/container
        shell: bash
        run: |
          bridge_log="../../artifacts/container-runtime/evidence/api-remote-cdp-pdf.log"
          if docker compose exec -T api sh -eu -c \
            'dotnet ExportDocManager.Api.dll --verify-browser-runtime' 2>&1 | tee "$bridge_log"; then
            exit 0
          fi

          diagnostic="$(tail -n 80 "$bridge_log" || true)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=API remote CDP PDF bridge validation failed::$diagnostic"
          exit 1

      - name: Validate reverse-proxy and security-header boundary
        working-directory: deploy/container
        shell: bash
        run: |
          api_container_id="$(docker compose ps -q api)"
          web_container_id="$(docker compose ps -q web)"
          if [ -z "$api_container_id" ]; then
            echo "API container is missing while checking the reverse-proxy boundary." >&2
            docker compose ps --all >&2 || true
            exit 1
          fi
          test -n "$web_container_id"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$web_container_id" |
            jq -e 'map(ascii_upcase) | index("ALL") != null' >/dev/null
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$web_container_id" |
            jq -e 'map(ascii_downcase) | index("no-new-privileges:true") != null' >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' "$web_container_id")" = "nginx"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$web_container_id")" = "true"
          docker inspect --format '{{json .HostConfig.Tmpfs}}' "$web_container_id" |
            jq -e 'has("/tmp")' >/dev/null
          api_published_ports="$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$api_container_id" | \
            jq -r '(.["5188/tcp"] // []) | length')"
          if [ "${api_published_ports:-0}" -gt 0 ]; then
            echo "API port 5188 must not be published to the host." >&2
            docker inspect --format '{{json .NetworkSettings.Ports}}' "$api_container_id" >&2 || true
            exit 1
          fi
          curl --fail --silent --show-error --dump-header ../../artifacts/container-runtime/evidence/http-headers.txt --output /dev/null "http://127.0.0.1:${EXPORTDOCMANAGER_WEB_PORT}/"
          grep -Eiq '^X-Content-Type-Options:[[:space:]]*nosniff' ../../artifacts/container-runtime/evidence/http-headers.txt
          grep -Eiq '^X-Frame-Options:[[:space:]]*DENY' ../../artifacts/container-runtime/evidence/http-headers.txt
          grep -Eiq '^Content-Security-Policy:' ../../artifacts/container-runtime/evidence/http-headers.txt
          grep -Eiq '^Permissions-Policy:' ../../artifacts/container-runtime/evidence/http-headers.txt

      - name: Validate bind-volume persistence across container recreation
        working-directory: deploy/container
        shell: bash
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
          CREATE TABLE IF NOT EXISTS container_lifecycle_probe (
            id integer PRIMARY KEY,
            marker text NOT NULL
          );
          INSERT INTO container_lifecycle_probe (id, marker)
          VALUES (1, 'persisted-across-container-recreation')
          ON CONFLICT (id) DO UPDATE SET marker = EXCLUDED.marker;
          SQL
          docker compose stop api
          docker compose rm -sf postgres
          docker compose up -d postgres
          for attempt in $(seq 1 90); do
            if docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "PostgreSQL did not recover after container recreation." >&2
              exit 1
            fi
            sleep 2
          done
          test "$(docker compose exec -T postgres psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT marker FROM container_lifecycle_probe WHERE id = 1")" = "persisted-across-container-recreation"

      - name: Validate separated PostgreSQL runtime roles
        working-directory: deploy/container
        shell: bash
        run: |
          set -a
          . ./.env
          set +a
          role_flags="$(docker compose exec -T postgres psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -F '|' -c \
            "SELECT rolname, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname IN ('$EXPORTDOCMANAGER_POSTGRES_APP_USER', '$EXPORTDOCMANAGER_POSTGRES_OWNER_ROLE', '$EXPORTDOCMANAGER_POSTGRES_MAINTENANCE_USER') ORDER BY rolname")"
          grep -F "$EXPORTDOCMANAGER_POSTGRES_APP_USER|t|f|f|f" <<<"$role_flags"
          grep -F "$EXPORTDOCMANAGER_POSTGRES_OWNER_ROLE|f|f|f|f" <<<"$role_flags"
          grep -F "$EXPORTDOCMANAGER_POSTGRES_MAINTENANCE_USER|t|f|t|f" <<<"$role_flags"

          docker compose exec -T \
            -e PGPASSWORD="$EXPORTDOCMANAGER_POSTGRES_MAINTENANCE_PASSWORD" \
            postgres psql -v ON_ERROR_STOP=1 \
            -U "$EXPORTDOCMANAGER_POSTGRES_MAINTENANCE_USER" \
            -d "$POSTGRES_DB" \
            --set=owner_role="$EXPORTDOCMANAGER_POSTGRES_OWNER_ROLE" <<'SQL'
          SET ROLE :"owner_role";
          DROP TABLE IF EXISTS container_app_role_probe;
          CREATE TABLE container_app_role_probe (
            id integer PRIMARY KEY,
            marker text NOT NULL
          );
          INSERT INTO container_app_role_probe (id, marker) VALUES (1, 'owner-created');
          SQL

          docker compose exec -T \
            -e PGPASSWORD="$EXPORTDOCMANAGER_POSTGRES_APP_PASSWORD" \
            postgres psql -v ON_ERROR_STOP=1 \
            -U "$EXPORTDOCMANAGER_POSTGRES_APP_USER" \
            -d "$POSTGRES_DB" <<'SQL'
          SELECT marker FROM container_app_role_probe WHERE id = 1;
          INSERT INTO container_app_role_probe (id, marker) VALUES (2, 'app-inserted');
          UPDATE container_app_role_probe SET marker = 'app-updated' WHERE id = 1;
          DELETE FROM container_app_role_probe WHERE id = 2;
          SQL

          if docker compose exec -T postgres sh -ec \
            'PGPASSWORD="$EXPORTDOCMANAGER_POSTGRES_APP_PASSWORD" psql -v ON_ERROR_STOP=1 -U "$EXPORTDOCMANAGER_POSTGRES_APP_USER" -d "$POSTGRES_DB" -c '\''CREATE TABLE forbidden_app_ddl(id integer)'\'' >/dev/null 2>&1'; then
            echo "The PostgreSQL application role unexpectedly has schema DDL privileges." >&2
            exit 1
          fi

      - name: Validate pg_dump and pg_restore recovery
        working-directory: deploy/container
        shell: bash
        run: |
          docker compose exec -T postgres pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc > ../../artifacts/container-runtime/exportdoc-validation.dump
          test -s ../../artifacts/container-runtime/exportdoc-validation.dump
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DROP TABLE container_lifecycle_probe"
          cat ../../artifacts/container-runtime/exportdoc-validation.dump | docker compose exec -T postgres pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists --exit-on-error
          test "$(docker compose exec -T postgres psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT marker FROM container_lifecycle_probe WHERE id = 1")" = "persisted-across-container-recreation"
          docker compose start api

      - name: Start HTTPS overlay and validate TLS boundary
        working-directory: deploy/container
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f docker-compose.https.yml up -d web
          for attempt in $(seq 1 90); do
            if curl --insecure --fail --silent --show-error "https://127.0.0.1:${EXPORTDOCMANAGER_HTTPS_PORT}/readyz" > ../../artifacts/container-runtime/evidence/https-readyz.json; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "HTTPS readiness timed out." >&2
              exit 1
            fi
            sleep 2
          done
          curl --insecure --fail --silent --show-error --dump-header ../../artifacts/container-runtime/evidence/https-headers.txt --output /dev/null "https://127.0.0.1:${EXPORTDOCMANAGER_HTTPS_PORT}/"
          grep -Eiq '^Strict-Transport-Security:[[:space:]]*max-age=31536000' ../../artifacts/container-runtime/evidence/https-headers.txt
          grep -Eiq '^Content-Security-Policy:' ../../artifacts/container-runtime/evidence/https-headers.txt

      - name: Capture lifecycle evidence
        if: ${{ always() }}
        working-directory: deploy/container
        shell: bash
        run: |
          mkdir -p ../../artifacts/container-runtime/evidence
          docker compose -f docker-compose.yml -f docker-compose.https.yml ps --all > ../../artifacts/container-runtime/evidence/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.https.yml logs --no-color postgres browser api web > ../../artifacts/container-runtime/evidence/compose.log 2>&1 || true

      - name: Upload lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-runtime-lifecycle
          path: artifacts/container-runtime/evidence
          if-no-files-found: error
          retention-days: 14

      - name: Stop validation stack
        if: ${{ always() }}
        working-directory: deploy/container
        shell: bash
        run: |
          if [ ! -f .env ]; then
            echo "Container runtime initialization did not run; no validation stack needs cleanup."
            exit 0
          fi

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.https.yml \
            --env-file .env \
            down --remove-orphans
