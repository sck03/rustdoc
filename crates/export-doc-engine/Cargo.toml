[package]
name = "export-doc-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rust application services, runtime paths and persistence adapters"

[features]
default = []
reference-backend = []
postgres = ["export-doc-storage/postgres"]
excel = ["dep:export-doc-excel"]
invoice-transfer = []
exchange-rates = ["dep:export-doc-exchange"]
hs-remote = ["dep:export-doc-hs"]
mail = ["dep:export-doc-mail"]
ocr = []
ai = ["dep:export-doc-ai"]
single-window = ["dep:export-doc-single-window"]

[dependencies]
export-doc-single-window = { path = "../export-doc-single-window", optional = true }
export-doc-ai = { path = "../export-doc-ai", optional = true }
export-doc-contracts = { path = "../export-doc-contracts" }
export-doc-storage = { path = "../export-doc-storage" }
export-doc-domain = { path = "../export-doc-domain" }
export-doc-report = { path = "../export-doc-report" }
export-doc-excel = { path = "../export-doc-excel", optional = true }
export-doc-exchange = { path = "../export-doc-exchange", optional = true }
export-doc-hs = { path = "../export-doc-hs", optional = true }
export-doc-mail = { path = "../export-doc-mail", optional = true }
export-doc-network = { path = "../export-doc-network" }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true
getrandom.workspace = true
image.workspace = true
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_025"] }
chrono.workspace = true
base64.workspace = true
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
zeroize = "=1.9.0"
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
ureq = { version = "=3.4.2", default-features = false, features = ["json", "native-tls"] }
url = "=2.5.8"
quick-xml = "=0.42.0"
fs2 = "=0.4.3"
pbkdf2 = { version = "=0.13.0", features = ["sha2"] }
subtle = "=2.6.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "macros"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
