name: Rust native delivery validation

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - version.json
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - apps/**
      - third_party/**
      - Resources/**
      - Templates/**
      - OcrModels/**
      - eng/native-runtime-packages.json
      - tools/excel-analyzer-rs/**
      - scripts/test_*.mjs
      - scripts/lib/**
      - scripts/github/native-validation-plan.mjs
      - .github/workflows/rust-native-validation.yml
      - .github/workflows/native-full-validation.yml
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Quick checks or complete platform/package validation
        type: choice
        options: [quick, full]
        default: quick
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - apps/export-doc-tauri/**
      - apps/export-doc-server/**
      - apps/export-doc-web/**
      - apps/exportdoc-ocr-rs/**
      - OcrModels/**
      - Resources/**
      - Templates/**
      - WebView2Runtime/**
      - VisualCppRuntime/**
      - eng/native-runtime-packages.json
      - tests/OcrFixtures/**
      - tests/ReportTemplateFixtures/**
      - third_party/**
      - scripts/test_editor_state_regressions_ui.mjs
      - scripts/test_packing_credit_workspace_ui.mjs
      - scripts/test_native_*.mjs
      - scripts/lib/native-*.ps1
      - scripts/lib/*support*.ps1
      - scripts/lib/rust-*.ps1
      - scripts/lib/platform-path-safety.ps1
      - scripts/lib/product-editions.ps1
      - scripts/lib/cargo-paths.mjs
      - scripts/lib/verified-download.mjs
      - scripts/provision-*.ps1
      - scripts/provision-*.mjs
      - scripts/package-native-web-server.ps1
      - scripts/product-editions.json
      - version.json
      - tools/excel-analyzer-rs/**
      - deploy/rust-native/**
      - scripts/build-native.*
      - scripts/run-tauri-build.mjs
      - scripts/run-native-docker.*
      - scripts/lib/native-docker-validation.mjs
      - .dockerignore
      - scripts/verify-native-desktop.mjs
      - scripts/verify-native-docker.mjs
      - .github/workflows/rust-native-validation.yml

permissions:
  contents: read

concurrency:
  group: rust-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks for changed inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      desktopCheck: ${{ steps.plan.outputs.desktopCheck }}
      office: ${{ steps.plan.outputs.office }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
      - id: plan
        run: node scripts/github/native-validation-plan.mjs
  core:
    name: Rust and web core quality
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright-browsers
      CARGO_BUILD_JOBS: 2
      TEMP: ${{ github.workspace }}/.codex-runtime/temp
      TMP: ${{ github.workspace }}/.codex-runtime/temp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .codex-runtime/cargo-home/registry
            .codex-runtime/cargo-home/git
            target/debug
          key: native-core-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/*/Cargo.toml', 'apps/export-doc-server/Cargo.toml', 'apps/export-doc-tauri/src-tauri/Cargo.toml') }}
      - name: Prepare managed temporary directory
        run: New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
      - name: Provision report fonts
        run: node scripts/provision-report-fonts.mjs
      - name: Check Rust formatting
        run: cargo fmt --all --check
      # Tauri's all-features check embeds frontendDist via custom-protocol.
      - name: Install frontend dependencies
        run: npm --prefix apps/export-doc-web ci
      - name: Build frontend
        run: npm --prefix apps/export-doc-web run build
      - name: Test backend workspace
        if: needs.changes.outputs.full != 'true'
        run: cargo test --locked --workspace --exclude export-doc-tauri
      - name: Test complete Rust workspace
        if: needs.changes.outputs.full == 'true'
        run: cargo test --locked --workspace
      - name: Test changed desktop host
        if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.full != 'true'
        run: cargo test --locked -p export-doc-tauri
      - name: Check shared desktop composition
        if: needs.changes.outputs.desktopCheck == 'true' && needs.changes.outputs.desktop != 'true' && needs.changes.outputs.full != 'true'
        run: cargo check --locked -p export-doc-tauri
      - name: Check all Rust features
        if: needs.changes.outputs.full == 'true'
        run: cargo check --locked --workspace --all-features
      - name: Verify generated API contract
        run: cargo run --locked -p export-doc-contracts --example generate_clients -- --check
      - name: Verify changed OA HTTP and UI integration
        if: needs.changes.outputs.office == 'true'
        run: |
          cargo build --locked -p export-doc-server --example office_review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/export-doc-web/node_modules/playwright/cli.js install --only-shell chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test_oa_integration_completion_ui.mjs
          exit $LASTEXITCODE
      - name: Trim disposable test binaries before caching compilation inputs
        if: success()
        run: pwsh -NoProfile -File scripts/clean-generated-artifacts.ps1 -RustTestOutputsOnly
  frontend-quality:
    name: Frontend build and layout quality
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright-browsers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json
      - run: npm --prefix apps/export-doc-web ci
      - run: node scripts/provision-report-fonts.mjs
      - run: npm --prefix apps/export-doc-web run build
      - run: node apps/export-doc-web/node_modules/playwright/cli.js install --only-shell chromium
      - run: npm --prefix apps/export-doc-web run test:accessibility-contracts
      - run: npm --prefix apps/export-doc-web run test:permission-contracts
      - run: npm --prefix apps/export-doc-web run test:scale-contracts
      - run: npm --prefix apps/export-doc-web run test:visual-baselines
      - name: Upload failed visual evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-visual-failure
          path: artifacts/frontend-visual-baseline
          if-no-files-found: ignore
          retention-days: 7
  frontend-regressions:
    name: Chromium editing and async regressions
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright-browsers
      TEMP: ${{ github.workspace }}/.codex-runtime/temp
      TMP: ${{ github.workspace }}/.codex-runtime/temp
      TMPDIR: ${{ github.workspace }}/.codex-runtime/temp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json
      - name: Prepare runtime and npm dependencies
        run: |
          mkdir -p "$TEMP"
          npm --prefix apps/export-doc-web ci
          node apps/export-doc-web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Validate editing, cancellation and request contracts
        run: |
          npm --prefix apps/export-doc-web run test:invoice-editing
          npm --prefix apps/export-doc-web run test:document-editor-ui
          npm --prefix apps/export-doc-web run test:report-designer-v3
          npm --prefix apps/export-doc-web run test:abortable-operations-ui
          npm --prefix apps/export-doc-web run test:email-template-workspace-ui
          npm --prefix apps/export-doc-web run test:concurrency-feedback
          npm --prefix apps/export-doc-web run test:browser-session-contracts

  full-validation:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/native-full-validation.yml
