name: Dependency security and SBOM governance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"
  push:
    branches: [main]
    paths:
      - "Directory.Packages.props"
      - "**/*.csproj"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "scripts/audit-dotnet-packages.mjs"
      - "scripts/generate-dependency-governance.mjs"
      - ".github/workflows/dependency-governance.yml"
  pull_request:
    paths:
      - "Directory.Packages.props"
      - "**/*.csproj"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "scripts/audit-dotnet-packages.mjs"
      - "scripts/generate-dependency-governance.mjs"
      - ".github/workflows/dependency-governance.yml"

concurrency:
  group: dependency-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
      CARGO_HOME: ${{ github.workspace }}/artifacts/cargo-home

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/export-doc-web/package-lock.json
            apps/export-doc-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore locked dependency graphs
        run: |
          dotnet restore ExportDocManager.sln
          npm ci --prefix apps/export-doc-web
          npm ci --prefix apps/export-doc-tauri
          cargo fetch --locked --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml
          cargo fetch --locked --manifest-path apps/exportdoc-ocr-rs/Cargo.toml
          cargo fetch --locked --manifest-path tools/excel-analyzer-rs/Cargo.toml

      - name: Validate Node 24 and artifact Action policy
        run: node scripts/verify-github-workflow-actions.mjs

      - name: Audit npm production dependencies
        run: |
          npm --prefix apps/export-doc-web run audit:production
          npm --prefix apps/export-doc-tauri run audit:production

      - name: Audit NuGet direct and transitive dependencies
        run: node scripts/audit-dotnet-packages.mjs

      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked --root "$CARGO_HOME"

      - name: Audit Rust lock files
        run: |
          # Tauri's current Linux WebKit/GTK3 stack still pulls glib 0.18.5.
          # Keep that one reviewed transitive exception explicit while failing
          # every new vulnerability, unsound advisory or yanked crate.
          "$CARGO_HOME/bin/cargo-audit" audit --deny unsound --deny yanked --ignore RUSTSEC-2024-0429 --file apps/export-doc-tauri/src-tauri/Cargo.lock
          "$CARGO_HOME/bin/cargo-audit" audit --deny unsound --deny yanked --file apps/exportdoc-ocr-rs/Cargo.lock
          "$CARGO_HOME/bin/cargo-audit" audit --deny unsound --deny yanked --file tools/excel-analyzer-rs/Cargo.lock

      - name: Generate SPDX, CycloneDX and third-party inventory
        run: node scripts/generate-dependency-governance.mjs artifacts/dependency-governance

      - name: Upload dependency governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-governance
          path: artifacts/dependency-governance
          if-no-files-found: warn
          retention-days: 30
