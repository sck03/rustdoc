name: Quality gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target-quality
      EXPORTDOCMANAGER_ALLOW_MISSING_BROWSER: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Restore dependencies
        run: |
          dotnet restore ExportDocManager.sln --locked-mode
          npm ci --prefix apps/export-doc-web

      - name: Build and test .NET solution
        run: |
          dotnet build ExportDocManager.sln -c Release --no-restore -m:1 -p:BuildInParallel=false
          for project in tests/ExportDocManager.{Infrastructure,Application,Domain,Api}.Tests/ExportDocManager.*.Tests.csproj; do
            echo "::group::Test $project"
            dotnet test "$project" -c Release --no-build -m:1 -p:BuildInParallel=false
            echo "::endgroup::"
          done

      - name: Build and test web contracts
        run: |
          npm --prefix apps/export-doc-web run build
          npm --prefix apps/export-doc-web run test:api-client-contracts
          npm --prefix apps/export-doc-web run test:browser-session-contracts
          npm --prefix apps/export-doc-web run test:invoice-text-normalization
          npm --prefix apps/export-doc-web run test:new-report-designer-exporter
          npm --prefix apps/export-doc-web run test:workspace-navigation
          npm --prefix apps/export-doc-web run test:supplier-assessment-analytics
          npm --prefix apps/export-doc-web run test:style-governance
          npm --prefix apps/export-doc-web run test:source-size-governance

      - name: Validate build and smoke scripts
        shell: pwsh
        run: ./scripts/verify-script-suite.ps1

      - name: Check Rust workspaces
        run: |
          cargo fmt --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml --check
          cargo fmt --manifest-path apps/exportdoc-ocr-rs/Cargo.toml --check
          cargo fmt --manifest-path tools/excel-analyzer-rs/Cargo.toml --check
          cargo check --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml --locked
          cargo check --manifest-path apps/exportdoc-ocr-rs/Cargo.toml --locked
          cargo check --manifest-path tools/excel-analyzer-rs/Cargo.toml --locked
