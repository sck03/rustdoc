[package]
name = "export-doc-tauri"
version = "0.1.2"
description = "ExportDocManager Tauri desktop with the shared Rust backend"
authors = ["ExportDocManager"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json.workspace = true

[dependencies]
export-doc-engine = { path = "../../../crates/export-doc-engine", features = ["s3-backup"] }
export-doc-server = { path = "../../export-doc-server", default-features = false }
fs2 = "=0.4.3"
libloading = "=0.9.0"
getrandom.workspace = true
rfd = { workspace = true, features = ["common-controls-v6"] }
regex = "=1.13.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Capabilities are fixed by the bundled configuration; runtime ACL mutation is unused.
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-single-instance = "=2.5.4"
# Tauri 2 uses signed installers directly; exclude legacy Windows ZIP extraction.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
base64.workspace = true
