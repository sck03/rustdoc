[package]
name = "export-doc-tauri"
version = "0.1.1"
description = "ExportDocManager Tauri desktop with the shared Rust backend"
authors = ["ExportDocManager"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
serde_json.workspace = true

[dependencies]
export-doc-engine = { path = "../../../crates/export-doc-engine" }
export-doc-server = { path = "../../export-doc-server", default-features = false }
base64.workspace = true
fs2 = "=0.4.3"
libloading = "=0.9.0"
getrandom.workspace = true
rfd = { workspace = true, features = ["common-controls-v6"] }
regex = "=1.13.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-updater = "=2.12.0"
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading"] }

[lints]
workspace = true
