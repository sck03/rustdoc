name: Build Windows desktop package
run-name: Windows desktop ${{ inputs.version }} / ${{ inputs.architecture }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: '程序版本，例如 0.1.2、v0.1.2 或 0.1.2-beta.1'
        required: true
        type: string
      architecture:
        description: 'Windows 架构'
        required: true
        default: x64
        type: choice
        options: [x64, arm64, all]
      publish_release:
        description: '构建成功后上传到对应版本的 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: write
    uses: ./.github/workflows/native-package-reusable.yml
    with:
      product: desktop
      os: windows
      architecture: ${{ inputs.architecture }}
      version: ${{ inputs.version }}
      publish_release: ${{ inputs.publish_release }}
