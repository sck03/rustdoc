name: Rust native delivery validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - crates/**
      - apps/export-doc-tauri/**
      - apps/export-doc-server/**
      - apps/export-doc-web/**
      - tools/excel-analyzer-rs/**
      - deploy/rust-native/**
      - scripts/build-native.*
      - scripts/run-native-docker.*
      - scripts/verify-native-desktop.mjs
      - scripts/verify-native-docker.mjs
      - .github/workflows/rust-native-validation.yml

permissions:
  contents: read

concurrency:
  group: rust-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.codex-runtime/rustup-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target-native
      CARGO_BUILD_JOBS: 2
      TMPDIR: ${{ github.workspace }}/.codex-runtime/temp
      TEMP: ${{ github.workspace }}/.codex-runtime/temp
      TMP: ${{ github.workspace }}/.codex-runtime/temp
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare workspace runtime directories
        shell: pwsh
        run: |
          @($env:CARGO_HOME, $env:RUSTUP_HOME, $env:CARGO_TARGET_DIR, $env:TEMP) |
            ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
      - name: Restore Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .codex-runtime/cargo-home/registry
            .codex-runtime/cargo-home/git
          key: native-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Provision verified shared fonts
        run: node scripts/provision-report-fonts.mjs
      - name: Format and generated contract
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-native-api-client.mjs --openapi crates/export-doc-contracts/src/openapi.json --check
          exit $LASTEXITCODE
      - name: Domain, storage and application tests
        run: cargo test --locked -p export-doc-contracts -p export-doc-domain -p export-doc-storage -p export-doc-excel -p export-doc-exchange -p export-doc-report -p export-doc-engine -p export-doc-server --target ${{ matrix.target }}
      - name: Feature-gated engine suites
        run: cargo test --locked -p export-doc-engine --features mail,excel,invoice-transfer,single-window --target ${{ matrix.target }}
      - name: Build the native desktop separately from the server
        run: cargo build --locked -p export-doc-tauri --target ${{ matrix.target }}
      - name: Check the Rust server composition root
        run: cargo check --locked -p export-doc-server --target ${{ matrix.target }}
      - name: Verify native dependency boundaries
        run: node scripts/verify-native-desktop.mjs --target ${{ matrix.target }}
      - name: Build full native desktop package including OCR
        shell: pwsh
        run: ./scripts/build-native.ps1 -NoPause -RustTarget ${{ matrix.target }}
      - name: Upload green desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exportdoc-native-desktop-${{ matrix.target }}
          path: artifacts/native-desktop/ExportDocManager.Tauri
          if-no-files-found: error

  browser-server:
    name: Browser server package (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.codex-runtime/cargo-target-native
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.1
      - name: Install macOS PostgreSQL 18 client
        if: runner.os == 'macOS'
        run: brew install postgresql@18
      - name: Assemble browser server package
        shell: pwsh
        run: |
          ./scripts/package-native-web-server.ps1 -NoPause -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'artifacts/browser-server')
      - name: Upload browser server package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exportdoc-browser-server-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/browser-server
          if-no-files-found: error

  container:
    name: Docker container lifecycle (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and start isolated containers
        shell: pwsh
        run: ./scripts/run-native-docker.ps1 -NoPause -Port 5195
      - name: Verify web, API and file tasks
        run: node scripts/verify-native-docker.mjs --url http://127.0.0.1:5195 --runtime deploy/rust-native/runtime --isolated-validation
      - name: Stop containers while retaining the databases
        shell: pwsh
        run: ./scripts/run-native-docker.ps1 -Stop -NoPause
      - name: Restart and verify persisted output
        shell: pwsh
        run: |
          ./scripts/run-native-docker.ps1 -NoPause -Port 5195
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-native-docker.mjs --url http://127.0.0.1:5195 --runtime deploy/rust-native/runtime --isolated-validation --resume
          exit $LASTEXITCODE
      - name: Stop containers
        if: always()
        shell: pwsh
        run: ./scripts/run-native-docker.ps1 -Stop -NoPause
