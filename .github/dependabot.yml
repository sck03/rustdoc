version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/apps/exportdoc-ocr-rs", "/tools/excel-analyzer-rs"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      tauri:
        patterns: ["tauri*", "tao", "wry"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/apps/export-doc-web", "/apps/export-doc-tauri"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
