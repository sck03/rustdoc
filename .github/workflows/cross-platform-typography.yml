name: Cross-platform typography and report validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Resources/Fonts/**"
      - "Templates/**"
      - "apps/export-doc-web/package.json"
      - "apps/export-doc-web/package-lock.json"
      - "apps/export-doc-web/src/**"
      - "scripts/provision-report-fonts.mjs"
      - "scripts/verify-font-license-policy.mjs"
      - "scripts/compare-report-pdf-metrics.mjs"
      - "scripts/extract-report-pdf-layout.py"
      - "scripts/provision-chrome-for-testing.ps1"
      - "scripts/report-layout-requirements.txt"
      - "scripts/test_frontend_scale_contracts.mjs"
      - "scripts/check_frontend_style_governance.mjs"
      - "scripts/baselines/frontend-style-governance.json"
      - "scripts/test_web_runtime_browser_session.mjs"
      - "scripts/test_login_security_contracts.mjs"
      - "scripts/test_react_router_declarative_contract.mjs"
      - "scripts/test_report_template_pdf_pixel_regression.mjs"
      - "scripts/test_report_template_pdf_regression.mjs"
      - "scripts/test_report_template_print_pixel_regression.mjs"
      - "scripts/test_report_template_visual_regression.mjs"
      - "scripts/lib/**"
      - "tests/ReportTemplateFixtures/**"
      - "src/ExportDocManager.Infrastructure/Services/BrowserRuntime/**"
      - "src/ExportDocManager.Infrastructure/Services/Reporting/**"
      - "tests/ExportDocManager.Infrastructure.Tests/ReportHtmlServiceInfrastructureTests.cs"
      - ".github/workflows/cross-platform-typography.yml"
  pull_request:
    paths:
      - "Resources/Fonts/**"
      - "Templates/**"
      - "apps/export-doc-web/package.json"
      - "apps/export-doc-web/package-lock.json"
      - "apps/export-doc-web/src/**"
      - "scripts/provision-report-fonts.mjs"
      - "scripts/verify-font-license-policy.mjs"
      - "scripts/compare-report-pdf-metrics.mjs"
      - "scripts/extract-report-pdf-layout.py"
      - "scripts/provision-chrome-for-testing.ps1"
      - "scripts/report-layout-requirements.txt"
      - "scripts/test_frontend_scale_contracts.mjs"
      - "scripts/check_frontend_style_governance.mjs"
      - "scripts/baselines/frontend-style-governance.json"
      - "scripts/test_web_runtime_browser_session.mjs"
      - "scripts/test_login_security_contracts.mjs"
      - "scripts/test_react_router_declarative_contract.mjs"
      - "scripts/test_report_template_pdf_pixel_regression.mjs"
      - "scripts/test_report_template_pdf_regression.mjs"
      - "scripts/test_report_template_print_pixel_regression.mjs"
      - "scripts/test_report_template_visual_regression.mjs"
      - "scripts/lib/**"
      - "tests/ReportTemplateFixtures/**"
      - "src/ExportDocManager.Infrastructure/Services/BrowserRuntime/**"
      - "src/ExportDocManager.Infrastructure/Services/Reporting/**"
      - "tests/ExportDocManager.Infrastructure.Tests/ReportHtmlServiceInfrastructureTests.cs"
      - ".github/workflows/cross-platform-typography.yml"

concurrency:
  group: cross-platform-typography-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-reports:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 125% / 150% font contract
            os: windows-latest
            slug: windows-x64
            chrome_platform: win64
            scale_profiles: windows-125,windows-150,windows-4k,desktop-zoom-200,mobile-safari-contract
          - name: macOS Retina font contract
            os: macos-15
            slug: macos-arm64
            chrome_platform: mac-arm64
            scale_profiles: macos-retina,mobile-safari-contract
          - name: Linux font contract
            os: ubuntu-latest
            slug: linux-x64
            chrome_platform: linux64
            scale_profiles: linux-100,mobile-320,mobile-375,mobile-keyboard-390,mobile-safari-contract

    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.codex-runtime/nuget-packages
      EXPORTDOCMANAGER_RETAIN_REPORT_TEST_ARTIFACTS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux Chromium runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libgbm1 libgtk-3-0 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Set up Python for PDF layout evidence
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install PDF layout test dependency
        run: python -m pip install --disable-pip-version-check -r scripts/report-layout-requirements.txt

      - name: Provision pinned report fonts
        shell: pwsh
        run: |
          node scripts/provision-report-fonts.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-font-license-policy.mjs --require-files
          exit $LASTEXITCODE

      - name: Provision Chrome Headless Shell
        shell: pwsh
        run: >-
          ./scripts/provision-chrome-for-testing.ps1
          -Product ChromeHeadlessShell
          -Platform ${{ matrix.chrome_platform }}

      - name: Provision full Chrome for PDF viewer regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/provision-chrome-for-testing.ps1
          -Product Chrome
          -Platform ${{ matrix.chrome_platform }}

      - name: Install frontend dependencies
        run: npm ci --prefix apps/export-doc-web

      - name: Validate browser session contracts
        run: npm --prefix apps/export-doc-web run test:browser-session-contracts

      - name: Prevent new hard-coded CSS debt
        run: npm --prefix apps/export-doc-web run test:style-governance

      - name: Prevent source responsibility files from regrowing
        run: npm --prefix apps/export-doc-web run test:source-size-governance

      - name: Validate real PDF viewer page navigation and pixels
        if: runner.os == 'Windows'
        run: npm --prefix apps/export-doc-web run test:template-pdf-pixels

      - name: Upload PDF viewer regression evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: report-pdf-viewer-${{ matrix.slug }}
          path: .codex-runtime/report-template-pdf-pixel-regression
          if-no-files-found: error
          retention-days: 14

      - name: Validate density, scaling and native font rendering
        timeout-minutes: 5
        env:
          EXPORTDOCMANAGER_SCALE_PROFILE_FILTER: ${{ matrix.scale_profiles }}
        run: npm --prefix apps/export-doc-web run test:scale-contracts

      - name: Upload frontend scale evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-scale-${{ matrix.slug }}
          path: artifacts/frontend-scale-contracts
          if-no-files-found: error
          retention-days: 14

      - name: Restore report test project
        run: dotnet restore tests/ExportDocManager.Infrastructure.Tests/ExportDocManager.Infrastructure.Tests.csproj --configfile NuGet.Config

      - name: Build report test project
        run: >-
          dotnet build tests/ExportDocManager.Infrastructure.Tests/ExportDocManager.Infrastructure.Tests.csproj
          -c Release
          -m:1
          -p:BuildInParallel=false
          --no-restore

      - name: Render long multilingual built-in reports to PDF
        timeout-minutes: 10
        shell: pwsh
        env:
          EXPORTDOCMANAGER_CHROMIUM_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '0' }}
          EXPORTDOCMANAGER_BROWSER_AUTOMATION_RECYCLE_USES: ${{ runner.os == 'macOS' && '4' || '100' }}
        run: |
          $tests = @(
            "ExportDocManager.Infrastructure.Tests.ReportHtmlServiceInfrastructureTests.RenderBuiltInProgramTemplatesToPdf_ShouldUseProgramRootBrowserAndRuntimeDataRoot",
            "ExportDocManager.Infrastructure.Tests.ReportHtmlServiceInfrastructureTests.RenderBuiltInProgramTemplatesWithMultiItemBusinessDataToPdf_ShouldPreservePaginationAndDomainIsolation"
          )
          foreach ($test in $tests) {
            dotnet test tests/ExportDocManager.Infrastructure.Tests/ExportDocManager.Infrastructure.Tests.csproj `
              -c Release `
              -m:1 `
              -p:BuildInParallel=false `
              --no-build `
              --blame-hang `
              --blame-hang-timeout 4m `
              --blame-hang-dump-type none `
              --logger "console;verbosity=normal" `
              --filter "FullyQualifiedName=$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify PDF wrapping and reject overlapping text
        run: python scripts/extract-report-pdf-layout.py .codex-runtime/ExportDocManager.Infrastructure.Tests

      - name: Upload rendered PDFs and metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-report-${{ matrix.slug }}
          path: |
            .codex-runtime/ExportDocManager.Infrastructure.Tests/**/RenderedPdfs/*.pdf
            .codex-runtime/ExportDocManager.Infrastructure.Tests/**/RenderedPdfs/*.metrics.json
            .codex-runtime/ExportDocManager.Infrastructure.Tests/**/RenderedPdfs/*.layout.json
          if-no-files-found: error
          retention-days: 14

  compare-platforms:
    name: Compare pagination and wrapping metrics
    needs: render-reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Download platform report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cross-platform-report-*
          path: artifacts/cross-platform-report-metrics

      - name: Compare report metrics
        env:
          EXPORTDOCMANAGER_EXPECTED_REPORT_PLATFORMS: 3
        run: node scripts/compare-report-pdf-metrics.mjs artifacts/cross-platform-report-metrics

      - name: Upload comparison summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-report-comparison
          path: artifacts/cross-platform-report-metrics/cross-platform-report-summary.json
          if-no-files-found: error
          retention-days: 30
