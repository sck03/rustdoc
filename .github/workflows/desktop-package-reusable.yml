name: Reusable desktop package build

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      runtime_identifier:
        required: true
        type: string
      rust_target:
        required: true
        type: string
      chrome_platform:
        required: true
        type: string
      bundle_targets:
        required: true
        type: string
      version:
        required: true
        type: string
      architecture:
        required: true
        type: string
      edition:
        required: true
        type: string
      include_browser:
        required: true
        type: boolean
      publish_release:
        required: true
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY_DOCUMENT:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_DOCUMENT:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_SALES:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SALES:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_FULL:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_FULL:
        required: false

concurrency:
  group: ${{ inputs.publish_release && format('desktop-release-{0}', inputs.edition) || format('desktop-{0}-{1}-{2}-{3}', inputs.edition, inputs.platform, inputs.architecture, inputs.version) }}
  cancel-in-progress: ${{ !inputs.publish_release }}

permissions:
  contents: write

jobs:
  package:
    name: ${{ inputs.platform }} ${{ inputs.architecture }} package
    runs-on: ${{ inputs.runner }}
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/.codex-runtime/dotnet-cli
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.codex-runtime/nuget-packages
      NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.codex-runtime/nuget-http-cache
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target-exportdoc
      EXPORTDOCMANAGER_TAURI_RID: ${{ inputs.runtime_identifier }}
      EXPORTDOCMANAGER_RUST_TARGET: ${{ inputs.rust_target }}
      EXPORTDOCMANAGER_PRODUCT_EDITION: ${{ inputs.edition }}
      EXPORTDOCMANAGER_ALLOW_MISSING_BROWSER: ${{ inputs.include_browser && 'false' || 'true' }}
      EXPORTDOCMANAGER_REQUIRE_SIGNED_UPDATER: ${{ inputs.publish_release && 'true' || 'false' }}
      EXPORTDOCMANAGER_UPDATER_ENDPOINT: ${{ inputs.edition == 'Document' && vars.EXPORTDOCMANAGER_UPDATER_ENDPOINT_DOCUMENT || inputs.edition == 'Sales' && vars.EXPORTDOCMANAGER_UPDATER_ENDPOINT_SALES || vars.EXPORTDOCMANAGER_UPDATER_ENDPOINT_FULL }}
      EXPORTDOCMANAGER_UPDATER_PUBLIC_KEY: ${{ inputs.edition == 'Document' && vars.EXPORTDOCMANAGER_UPDATER_PUBLIC_KEY_DOCUMENT || inputs.edition == 'Sales' && vars.EXPORTDOCMANAGER_UPDATER_PUBLIC_KEY_SALES || vars.EXPORTDOCMANAGER_UPDATER_PUBLIC_KEY_FULL }}
      EXPORTDOCMANAGER_ALLOW_INSECURE_UPDATER_ENDPOINT: ${{ vars.EXPORTDOCMANAGER_ALLOW_INSECURE_UPDATER_ENDPOINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.edition == 'Document' && secrets.TAURI_SIGNING_PRIVATE_KEY_DOCUMENT || inputs.edition == 'Sales' && secrets.TAURI_SIGNING_PRIVATE_KEY_SALES || secrets.TAURI_SIGNING_PRIVATE_KEY_FULL }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.edition == 'Document' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_DOCUMENT || inputs.edition == 'Sales' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SALES || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_FULL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify public repository boundary
        shell: pwsh
        run: ./scripts/github/verify-public-source.ps1

      - name: Install Linux desktop packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y file xdg-utils libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/export-doc-web/package-lock.json
            apps/export-doc-tauri/package-lock.json

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.rust_target }}

      - name: Initialize workspace build directories
        shell: pwsh
        run: |
          @(
            $env:DOTNET_CLI_HOME,
            $env:NUGET_PACKAGES,
            $env:NUGET_HTTP_CACHE_PATH,
            $env:npm_config_cache,
            $env:CARGO_HOME,
            $env:CARGO_TARGET_DIR
          ) | ForEach-Object { New-Item -ItemType Directory -Path $_ -Force | Out-Null }

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          npm ci --prefix apps/export-doc-web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix apps/export-doc-tauri
          exit $LASTEXITCODE

      - name: Validate and apply requested version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()
          if ($version.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "版本格式无效：$($env:REQUESTED_VERSION)。请使用 0.1.2 或 0.1.2-beta.1。"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node scripts/sync-version.mjs $version
          exit $LASTEXITCODE

      - name: Fetch Rust dependencies
        shell: pwsh
        run: cargo fetch --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml --target ${{ inputs.rust_target }}

      - name: Provision Chrome Headless Shell
        if: inputs.include_browser && inputs.chrome_platform != 'chromium-linux-arm64'
        shell: pwsh
        run: >-
          ./scripts/provision-chrome-for-testing.ps1
          -Product ChromeHeadlessShell
          -Platform ${{ inputs.chrome_platform }}

      - name: Provision Chromium ARM64
        if: inputs.include_browser && inputs.chrome_platform == 'chromium-linux-arm64'
        shell: pwsh
        run: ./scripts/provision-playwright-chromium-arm64.ps1

      - name: Verify staged Chrome Headless Shell
        if: inputs.include_browser
        shell: pwsh
        run: |
          $browserRoot = if ('${{ inputs.chrome_platform }}' -eq 'chromium-linux-arm64') { Join-Path $env:GITHUB_WORKSPACE 'Browsers/ChromiumArm64' } else { Join-Path $env:GITHUB_WORKSPACE "Browsers/ChromeForTesting/${{ inputs.chrome_platform }}" }
          $browser = Get-ChildItem -LiteralPath $browserRoot -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("chrome-headless-shell.exe", "chrome-headless-shell", "chrome") } |
            Select-Object -First 1
          if ($null -eq $browser) {
            throw "Chrome Headless Shell was not staged under '$browserRoot'."
          }
          if ($env:RUNNER_OS -ne "Windows") {
            $chmod = Get-Command chmod -ErrorAction Stop
            & $chmod.Source "+x" $browser.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to make Chrome Headless Shell executable: $($browser.FullName)"
            }
          }
          Write-Host "Chrome Headless Shell staged at $($browser.FullName)"

      - name: Verify bundled browser PDF generation
        if: inputs.include_browser
        shell: pwsh
        run: ./scripts/verify-bundled-browser-pdf.ps1 -BrowserRoot ./Browsers

      - name: Configure Linux AppImage compatibility
        if: inputs.platform == 'linux' && contains(inputs.bundle_targets, 'appimage')
        shell: bash
        run: echo "NO_STRIP=1" >> "$GITHUB_ENV"

      - name: Build unsigned desktop package
        if: ${{ !inputs.publish_release }}
        shell: pwsh
        run: npm --prefix apps/export-doc-tauri run build -- --verbose --target ${{ inputs.rust_target }} --bundles ${{ inputs.bundle_targets }} --no-sign

      - name: Build signed updater package
        if: inputs.publish_release
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXPORTDOCMANAGER_UPDATER_PUBLIC_KEY)) { throw "请配置仓库变量 EXPORTDOCMANAGER_UPDATER_PUBLIC_KEY。" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "请配置仓库 Secret TAURI_SIGNING_PRIVATE_KEY。" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "请配置仓库 Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD，并使用带密码的私钥。" }
          if ([string]::IsNullOrWhiteSpace($env:EXPORTDOCMANAGER_UPDATER_ENDPOINT)) {
            Write-Host "未配置自定义更新地址；构建器将按产品版自动使用对应的 GitHub Release 更新通道。"
          }
          npm --prefix apps/export-doc-tauri run build -- --verbose --target ${{ inputs.rust_target }} --bundles ${{ inputs.bundle_targets }}
          exit $LASTEXITCODE

      - name: Verify bundled Chrome Headless Shell resource
        if: inputs.include_browser
        shell: pwsh
        run: |
          $resourceRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/tauri-bundle/resources/Browsers"
          $browser = Get-ChildItem -LiteralPath $resourceRoot -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("chrome-headless-shell.exe", "chrome-headless-shell", "chrome") } |
            Select-Object -First 1
          if ($null -eq $browser) {
            throw "Chrome Headless Shell did not enter the Tauri resource staging directory '$resourceRoot'."
          }
          if ($env:RUNNER_OS -ne "Windows") {
            $chmod = Get-Command chmod -ErrorAction Stop
            & $chmod.Source "+x" $browser.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to preserve bundled Chrome Headless Shell executable permission: $($browser.FullName)"
            }
          }
          Write-Host "Chrome Headless Shell bundled from $($browser.FullName)"

      - name: Verify bundled Rust PP-OCRv6 runtime
        shell: pwsh
        run: |
          $resourceRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/tauri-bundle/resources"
          $apiRelative = if ($env:RUNNER_OS -eq "Windows") { "sidecar/ExportDocManager.Api.exe" } else { "sidecar/ExportDocManager.Api" }
          $ocrRelative = if ($env:RUNNER_OS -eq "Windows") { "sidecar/ocr/exportdoc-ocr.exe" } else { "sidecar/ocr/exportdoc-ocr" }
          $api = Join-Path $resourceRoot $apiRelative
          $ocr = Join-Path $resourceRoot $ocrRelative
          if (-not (Test-Path -LiteralPath $ocr -PathType Leaf)) { throw "Rust OCR Sidecar was not bundled: $ocr" }
          if ($env:RUNNER_OS -ne "Windows") {
            & chmod +x $api $ocr
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $dataRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/ocr-desktop-check"
          & $api --app-root $resourceRoot --data-root $dataRoot --verify-ocr-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $dataRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify lean desktop payload
        shell: pwsh
        run: ./scripts/verify-package-payload.ps1 -PackageRoot ./artifacts/tauri-bundle/resources -Profile Desktop -RuntimeIdentifier ${{ inputs.runtime_identifier }}

      - name: Build and verify portable desktop package
        shell: pwsh
        run: >-
          ./scripts/package-desktop-portable.ps1
          -Platform ${{ inputs.platform }}
          -RuntimeIdentifier ${{ inputs.runtime_identifier }}
          -RustTarget ${{ inputs.rust_target }}
          -Architecture ${{ inputs.architecture }}
          -Edition ${{ inputs.edition }}
          -Version ${{ steps.version.outputs.value }}
          -CargoTargetRoot ${{ env.CARGO_TARGET_DIR }}
          -ResourceRoot ./artifacts/tauri-bundle/resources
          -OutputRoot ./artifacts/desktop-portable

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: export-doc-manager-${{ inputs.platform }}-${{ inputs.architecture }}-${{ inputs.edition }}-${{ steps.version.outputs.value }}-installer
          path: artifacts/cargo-target-exportdoc/**/release/bundle/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload portable desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: export-doc-manager-${{ inputs.platform }}-${{ inputs.architecture }}-${{ inputs.edition }}-${{ steps.version.outputs.value }}-portable
          path: artifacts/desktop-portable/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish immutable edition release and update channel
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/publish-tauri-updater-manifest.ps1
          -Platform ${{ inputs.platform }}
          -Architecture ${{ inputs.architecture }}
          -Edition ${{ inputs.edition }}
          -Version ${{ steps.version.outputs.value }}
          -BundleRoot ${{ env.CARGO_TARGET_DIR }}
          -PortableAssetRoot ./artifacts/desktop-portable/packages

      - name: Write package summary
        shell: pwsh
        run: |
          @'
          ## ExportDocManager 桌面包
          - 平台：`${{ inputs.platform }}`
          - 架构：`${{ inputs.architecture }}`
          - 版本：`${{ steps.version.outputs.value }}`
          - 产品版：`${{ inputs.edition }}`
          - 内置报表浏览器：`${{ inputs.include_browser }}`
          - 安装版：`保留现有 Tauri bundle 产物`
          - 绿色便携版：`${{ inputs.platform == 'windows' && 'ZIP' || 'tar.gz' }}`，首次运行在解包目录旁创建 `App_Data`
          - 发布到 GitHub Release：`${{ inputs.publish_release }}`
          - 更新签名：`${{ inputs.publish_release && '已启用，缺少构建密钥会直接失败' || '未启用，仅用于测试和人工验收' }}`
          - 系统商业签名：`本阶段暂不强制；Windows Authenticode 与 macOS Developer ID/公证列入正式商业发布前门禁`
          - 默认更新地址：`${{ inputs.publish_release && '产品版专属 GitHub Release 通道；配置对应产品版变量时使用自定义地址' || '不适用' }}`
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
