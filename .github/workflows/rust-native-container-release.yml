name: Rust native container release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: rust-native-container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Docker lifecycle ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and start isolated containers
        shell: pwsh
        run: ./scripts/run-native-docker.ps1 -NoPause -Port 5195
      - name: Verify web, API and file tasks
        run: node scripts/verify-native-docker.mjs --url http://127.0.0.1:5195 --runtime deploy/rust-native/runtime --isolated-validation
      - name: Stop containers while retaining the databases
        shell: pwsh
        run: ./scripts/run-native-docker.ps1 -Stop -NoPause
      - name: Restart and verify persisted output
        shell: pwsh
        run: |
          ./scripts/run-native-docker.ps1 -NoPause -Port 5195
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-native-docker.mjs --url http://127.0.0.1:5195 --runtime deploy/rust-native/runtime --isolated-validation --resume
          exit $LASTEXITCODE
      - name: Stop containers
        if: always()
        shell: pwsh
        run: ./scripts/run-native-docker.ps1 -Stop -NoPause

  publish:
    name: Publish GHCR image
    if: inputs.publish == true
    needs: lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # reviewed
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Rust native image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # reviewed
        with:
          context: .
          file: deploy/rust-native/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/exportdoc-rust-native:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/exportdoc-rust-native:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
