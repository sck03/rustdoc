name: Cross-platform validation

on:
  workflow_dispatch:

concurrency:
  group: cross-platform-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-validation:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 + Windows ARM64 contract
            os: windows-latest
            primary_rid: win-x64
            secondary_rid: win-arm64
            rust_target: x86_64-pc-windows-msvc
          - name: Linux x64 + Linux ARM64 contract
            os: ubuntu-latest
            primary_rid: linux-x64
            secondary_rid: linux-arm64
            rust_target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon ARM64 contract
            os: macos-15
            primary_rid: osx-arm64
            secondary_rid: ''
            rust_target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target-exportdoc
      CARGO_BUILD_JOBS: 2
      # Public source intentionally excludes large Chrome Headless Shell
      # binaries.  Cross-platform validation checks the shell and path
      # contracts; release workflows provision the renderer explicitly.
      EXPORTDOCMANAGER_ALLOW_MISSING_BROWSER: true
      EXPORTDOCMANAGER_RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/export-doc-web/package-lock.json
            apps/export-doc-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.rust_target }}

      - name: Install web and Tauri dependencies
        run: |
          npm ci --prefix apps/export-doc-web
          npm ci --prefix apps/export-doc-tauri

      - name: Validate signed updater release trust contract
        run: npm --prefix apps/export-doc-tauri run test:updater-release-contract

      - name: Restore .NET projects
        run: dotnet restore ExportDocManager.sln --locked-mode

      - name: Build cross-platform backend layers
        run: dotnet build src/ExportDocManager.Api/ExportDocManager.Api.csproj --no-restore -c Release -v minimal

      # A solution restore without --runtime creates only the portable
      # net10.0 asset graph.  The contract builds below target two different
      # RIDs, so restore the complete project-reference graph explicitly for
      # each declared RID before using --no-restore.  This avoids project.assets.json
      # failures in Domain/Application/Infrastructure on hosted runners.
      - name: Restore primary backend runtime graph
        run: dotnet restore src/ExportDocManager.Infrastructure/ExportDocManager.Infrastructure.csproj -r ${{ matrix.primary_rid }} /p:ExportDocRuntimeRestore=true

      - name: Validate primary backend contract
        run: dotnet build src/ExportDocManager.Infrastructure/ExportDocManager.Infrastructure.csproj --no-restore -c Release -r ${{ matrix.primary_rid }} -v minimal

      - name: Restore secondary backend runtime graph
        if: matrix.secondary_rid != ''
        run: dotnet restore src/ExportDocManager.Infrastructure/ExportDocManager.Infrastructure.csproj -r ${{ matrix.secondary_rid }} /p:ExportDocRuntimeRestore=true

      - name: Validate secondary backend contract
        if: matrix.secondary_rid != ''
        run: dotnet build src/ExportDocManager.Infrastructure/ExportDocManager.Infrastructure.csproj --no-restore -c Release -r ${{ matrix.secondary_rid }} -v minimal

      - name: Test portable runtime path contracts
        run: >-
          dotnet test tests/ExportDocManager.Infrastructure.Tests/ExportDocManager.Infrastructure.Tests.csproj
          -c Release
          -m:1
          -p:BuildInParallel=false
          --filter "FullyQualifiedName~RuntimeAppPathProviderTests|FullyQualifiedName~InfrastructurePathPolicyTests|FullyQualifiedName~RuntimeDependencyDiagnosticsServiceTests"

      - name: Build shared React frontend
        run: npm --prefix apps/export-doc-web run build

      - name: Test desktop offline query contract
        run: npm --prefix apps/export-doc-web run test:query-network-mode

      - name: Test container packing render contracts
        run: npm --prefix apps/export-doc-web run test:container-packing-model

      - name: Fetch native Rust dependencies
        run: cargo fetch --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml --locked --target ${{ matrix.rust_target }}

      - name: Check native Tauri shell
        run: cargo check --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml --locked --target ${{ matrix.rust_target }}

      - name: Test native Tauri path contracts
        run: cargo test --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml --locked --target ${{ matrix.rust_target }}
