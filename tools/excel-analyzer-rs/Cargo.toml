[package]
name = "exportdoc-excel-analyzer"
version = "0.1.2"
edition = "2021"
description = "Rust Excel structure analyzer for ExportDocManager import previews"
license = "MIT OR Apache-2.0"

[dependencies]
calamine = "=0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
calamine = { path = "../../third_party/calamine-0.37.0" }

[profile.dev]
debug = "line-tables-only"
