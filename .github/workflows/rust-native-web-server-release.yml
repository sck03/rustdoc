name: Rust native web server release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-native-web-server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Web server ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
    env:
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.codex-runtime/rustup-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.codex-runtime/cargo-target-native
      CARGO_BUILD_JOBS: 2
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      TMPDIR: ${{ github.workspace }}/.codex-runtime/temp
      TEMP: ${{ github.workspace }}/.codex-runtime/temp
      TMP: ${{ github.workspace }}/.codex-runtime/temp
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare workspace runtime directories
        shell: pwsh
        run: |
          @($env:CARGO_HOME, $env:RUSTUP_HOME, $env:CARGO_TARGET_DIR, $env:TEMP) |
            ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json
      - name: Install macOS PostgreSQL 18 client
        if: runner.os == 'macOS'
        run: brew install postgresql@18
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Restore Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .codex-runtime/cargo-home/registry
            .codex-runtime/cargo-home/git
          key: native-web-server-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Build web server package
        shell: pwsh
        run: |
          ./scripts/package-native-web-server.ps1 -Configuration Release -RuntimeIdentifier ${{ matrix.target }} -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Join-Path $env:GITHUB_WORKSPACE 'artifacts/native-web-server'
          $extension = if ($IsWindows) { 'zip' } else { 'tar.gz' }
          ./scripts/lib/archive-native-release.ps1 -Source $source -Destination "artifacts/releases/exportdoc-web-server-${{ matrix.artifact }}.$extension"
      - name: Upload web server package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exportdoc-native-web-server-${{ matrix.artifact }}
          path: artifacts/releases/exportdoc-web-server-${{ matrix.artifact }}.*
          if-no-files-found: error
