name: Release script validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'version.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/export-doc-web/package*.json'
      - 'deploy/rust-native/**'
      - 'docs/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'version.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/export-doc-web/package*.json'
      - 'deploy/rust-native/**'
      - 'docs/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json
      - name: Restore locked script test dependencies
        run: npm --prefix apps/export-doc-web ci
      - name: Validate release contracts
        run: |
          node scripts/test_native_release_contract.mjs
          node scripts/test_native_validation_plan.mjs
      - name: Validate action pins and updater boundary
        run: |
          node scripts/verify-github-workflow-actions.mjs
          node scripts/test_tauri_updater_release_contract.mjs
          node scripts/verify-documentation-links.mjs
      - name: Validate script syntax and process contracts
        shell: pwsh
        run: ./scripts/verify-script-suite.ps1
      - name: Restore actionlint download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .codex-runtime/tools/actionlint/downloads
          key: actionlint-1.7.12-linux-amd64-v1
      - name: Validate workflow syntax with checksum-verified actionlint
        timeout-minutes: 7
        run: |
          mkdir -p .codex-runtime/tools/actionlint/downloads
          cd .codex-runtime/tools/actionlint
          cd downloads
          for asset in actionlint_1.7.12_linux_amd64.tar.gz actionlint_1.7.12_checksums.txt; do
            if [ ! -s "$asset" ]; then
              curl --fail --location --retry 8 --retry-delay 10 --retry-max-time 180 --connect-timeout 20 --max-time 60 \
                -o "$asset.part" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$asset"
              mv "$asset.part" "$asset"
            fi
          done
          cp actionlint_1.7.12_linux_amd64.tar.gz ../actionlint.tar.gz
          cp actionlint_1.7.12_checksums.txt ../checksums.txt
          cd ..
          awk '$2 == "actionlint_1.7.12_linux_amd64.tar.gz" {print $1 "  actionlint.tar.gz"}' checksums.txt | sha256sum --check --strict
          tar -xzf actionlint.tar.gz
          cd "$GITHUB_WORKSPACE"
          .codex-runtime/tools/actionlint/actionlint -color -shellcheck=''
