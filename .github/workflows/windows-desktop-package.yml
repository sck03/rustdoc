name: Build Windows desktop package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '程序版本（例如 0.1.2，可输入 v0.1.2）'
        required: true
        type: string
      edition:
        description: '产品功能版本'
        required: true
        default: Full
        type: choice
        options:
          - Full
          - Document
          - Sales
      publish_release:
        description: '同时上传到对应版本的 GitHub Release'
        required: true
        default: false
        type: boolean

jobs:
  package:
    if: ${{ !inputs.publish_release }}
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-package-reusable.yml
    with:
      platform: windows
      runner: windows-latest
      runtime_identifier: win-x64
      rust_target: x86_64-pc-windows-msvc
      chrome_platform: win64
      bundle_targets: nsis
      version: ${{ inputs.version }}
      architecture: x64
      edition: ${{ inputs.edition }}
      include_browser: ${{ inputs.edition != 'Sales' }}
      publish_release: false

  release:
    if: ${{ inputs.publish_release }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/desktop-package-reusable.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY_DOCUMENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_DOCUMENT }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_DOCUMENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_DOCUMENT }}
      TAURI_SIGNING_PRIVATE_KEY_SALES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_SALES }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SALES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SALES }}
      TAURI_SIGNING_PRIVATE_KEY_FULL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_FULL }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_FULL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_FULL }}
    with:
      platform: windows
      runner: windows-latest
      runtime_identifier: win-x64
      rust_target: x86_64-pc-windows-msvc
      chrome_platform: win64
      bundle_targets: nsis
      version: ${{ inputs.version }}
      architecture: x64
      edition: ${{ inputs.edition }}
      include_browser: ${{ inputs.edition != 'Sales' }}
      publish_release: true
