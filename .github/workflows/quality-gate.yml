name: Quality gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/.codex-runtime/dotnet-cli
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
      NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.codex-runtime/nuget-http-cache
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target-quality
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      EXPORTDOCMANAGER_ALLOW_MISSING_BROWSER: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json

      - name: Verify public repository boundary
        shell: pwsh
        run: ./scripts/github/verify-public-source.ps1

      - name: Verify GitHub Action runtime policy
        run: node scripts/verify-github-workflow-actions.mjs

      - name: Verify updater release trust contract
        run: node scripts/test_tauri_updater_release_contract.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Restore quality-gate dependency caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/nuget-packages
            .codex-runtime/cargo-home/registry
            .codex-runtime/cargo-home/git
            artifacts/cargo-target-quality
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/packages.lock.json', 'rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            quality-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore dependencies
        run: |
          dotnet restore ExportDocManager.sln --locked-mode --configfile NuGet.Config
          npm ci --prefix apps/export-doc-web

      - name: Verify .NET formatting
        run: dotnet format ExportDocManager.sln --verify-no-changes --no-restore

      - name: Build and test .NET solution
        id: dotnet_tests
        shell: pwsh
        run: ./scripts/run-tests.ps1 -Configuration Release -NoRestore -NoPause

      - name: Report failed .NET tests
        if: steps.dotnet_tests.outcome == 'failure'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath TestResults -PathType Container)) {
            Write-Output "::error title=.NET test runner failed::The .NET test step failed before producing TestResults."
            exit 1
          }
          Get-ChildItem TestResults -Filter *.trx -File | ForEach-Object {
            ([xml](Get-Content $_)).TestRun.Results.UnitTestResult |
              Where-Object outcome -eq "Failed" |
              ForEach-Object {
                $details = "$($_.testName): $($_.Output.ErrorInfo.Message)"
                $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                Write-Output "::error title=.NET test failed::$details"
              }
          }
          exit 1

      - name: Build and test web contracts
        run: |
          npm --prefix apps/export-doc-web run build
          npm --prefix apps/export-doc-web run test:api-client-contracts
          npm --prefix apps/export-doc-web run test:browser-session-contracts
          npm --prefix apps/export-doc-web run test:business-date-refresh
          npm --prefix apps/export-doc-web run test:business-status-model
          npm --prefix apps/export-doc-web run test:service-availability-model
          npm --prefix apps/export-doc-web run test:session-expiry-model
          npm --prefix apps/export-doc-web run test:session-channel
          npm --prefix apps/export-doc-web run test:invoice-text-normalization
          npm --prefix apps/export-doc-web run test:invoice-list-models
          npm --prefix apps/export-doc-web run test:settings-models
          npm --prefix apps/export-doc-web run test:email-template-model
          npm --prefix apps/export-doc-web run test:concurrency-feedback
          npm --prefix apps/export-doc-web run test:query-retry-policy
          npm --prefix apps/export-doc-web run test:query-network-mode
          npm --prefix apps/export-doc-web run test:background-job-polling
          npm --prefix apps/export-doc-web run test:authentication-failure-events
          npm --prefix apps/export-doc-web run test:new-report-designer-exporter
          npm --prefix apps/export-doc-web run test:print-preview-document
          npm --prefix apps/export-doc-web run test:workspace-navigation
          npm --prefix apps/export-doc-web run test:accessibility-contracts
          npm --prefix apps/export-doc-web run test:font-policy
          npm --prefix apps/export-doc-web run test:supplier-assessment-analytics
          npm --prefix apps/export-doc-web run test:audit-log-maintenance-model
          npm --prefix apps/export-doc-web run test:report-template-workspace-model
          npm --prefix apps/export-doc-web run test:customs-coo-model
          npm --prefix apps/export-doc-web run test:container-packing-model
          npm --prefix apps/export-doc-web run test:reference-catalog-model
          npm --prefix apps/export-doc-web run test:style-governance
          npm --prefix apps/export-doc-web run test:source-size-governance

      - name: Check Rust workspaces
        run: |
          cargo fmt --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml --check
          cargo fmt --manifest-path apps/exportdoc-ocr-rs/Cargo.toml --check
          cargo fmt --manifest-path tools/excel-analyzer-rs/Cargo.toml --check
          cargo test --manifest-path apps/export-doc-tauri/src-tauri/Cargo.toml --locked
          cargo test --manifest-path apps/exportdoc-ocr-rs/Cargo.toml --locked
          cargo test --manifest-path tools/excel-analyzer-rs/Cargo.toml --locked
