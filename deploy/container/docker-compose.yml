name: export-doc-manager

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exportdoc}
      POSTGRES_USER: ${POSTGRES_USER:-exportdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=PG_UNICODE_FAST"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5188
      EXPORTDOCMANAGER_NETWORK_MODE: "true"
      EXPORTDOCMANAGER_BOOTSTRAP_TOKEN: ${EXPORTDOCMANAGER_BOOTSTRAP_TOKEN:?请在 .env 中设置至少 24 个字符的 EXPORTDOCMANAGER_BOOTSTRAP_TOKEN}
      EXPORTDOCMANAGER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      EXPORTDOCMANAGER_MASTER_KEY: ${EXPORTDOCMANAGER_MASTER_KEY:-}
      EXPORTDOCMANAGER_PRODUCT_EDITION: Full
      EXPORTDOCMANAGER_DATA_ROOT: /runtime-data
      EXPORTDOCMANAGER_CHROMIUM_NO_SANDBOX: "false"
      EXPORTDOCMANAGER_ALLOWED_ORIGINS: ${EXPORTDOCMANAGER_ALLOWED_ORIGINS:-}
      EXPORTDOCMANAGER_TRUSTED_PROXIES: "${EXPORTDOCMANAGER_REVERSE_PROXY_IP:?请先运行 initialize-container-runtime.ps1 或在 .env 中设置 EXPORTDOCMANAGER_REVERSE_PROXY_IP};${EXPORTDOCMANAGER_ADDITIONAL_TRUSTED_PROXIES:-}"
      TZ: ${TZ:-Asia/Shanghai}
      EXPORTDOCMANAGER_BROWSER_GLOBAL_CONCURRENCY: ${EXPORTDOCMANAGER_BROWSER_GLOBAL_CONCURRENCY:-2}
      EXPORTDOCMANAGER_BROWSER_PDF_CONCURRENCY: ${EXPORTDOCMANAGER_BROWSER_PDF_CONCURRENCY:-2}
      EXPORTDOCMANAGER_BROWSER_AUTOMATION_CONCURRENCY: ${EXPORTDOCMANAGER_BROWSER_AUTOMATION_CONCURRENCY:-1}
    shm_size: "512mb"
    volumes:
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/api-data:/runtime-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 3 http://127.0.0.1:5188/readyz >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
    expose:
      - "5188"

  web:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${EXPORTDOCMANAGER_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${EXPORTDOCMANAGER_REVERSE_PROXY_IP:?请先运行 initialize-container-runtime.ps1 或在 .env 中设置 EXPORTDOCMANAGER_REVERSE_PROXY_IP}

networks:
  default:
    ipam:
      config:
        - subnet: ${EXPORTDOCMANAGER_CONTAINER_SUBNET:?请先运行 initialize-container-runtime.ps1 或在 .env 中设置 EXPORTDOCMANAGER_CONTAINER_SUBNET}
