name: Rust native delivery validation

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - version.json
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - apps/**
      - third_party/**
      - Resources/**
      - Templates/**
      - OcrModels/**
      - eng/native-runtime-packages.json
      - tools/excel-analyzer-rs/**
      - scripts/test_*.mjs
      - scripts/lib/**
      - scripts/github/native-validation-plan.mjs
      - .github/actions/**
      - .github/workflows/rust-native-validation.yml
      - .github/workflows/native-full-validation.yml
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Quick unit/UI checks or complete integration/platform/package validation
        type: choice
        options: [quick, full]
        default: quick
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - apps/export-doc-tauri/**
      - apps/export-doc-server/**
      - apps/export-doc-web/**
      - apps/exportdoc-ocr-rs/**
      - OcrModels/**
      - Resources/**
      - Templates/**
      - WebView2Runtime/**
      - VisualCppRuntime/**
      - eng/native-runtime-packages.json
      - tests/OcrFixtures/**
      - tests/ReportTemplateFixtures/**
      - third_party/**
      - scripts/test_*.mjs
      - scripts/lib/**
      - scripts/github/native-validation-plan.mjs
      - scripts/provision-*.ps1
      - scripts/provision-*.mjs
      - scripts/package-native-web-server.ps1
      - scripts/product-editions.json
      - version.json
      - tools/excel-analyzer-rs/**
      - deploy/rust-native/**
      - scripts/build-native.*
      - scripts/run-tauri-build.mjs
      - scripts/run-native-docker.*
      - scripts/lib/native-docker-validation.mjs
      - .dockerignore
      - scripts/verify-native-desktop.mjs
      - scripts/verify-native-docker.mjs
      - .github/actions/**
      - .github/workflows/rust-native-validation.yml
      - .github/workflows/native-full-validation.yml

permissions:
  contents: read

concurrency:
  group: rust-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks for changed inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      desktopCheck: ${{ steps.plan.outputs.desktopCheck }}
      ocr: ${{ steps.plan.outputs.ocr }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
      - id: plan
        run: node scripts/github/native-validation-plan.mjs
  core:
    name: Rust unit tests and contracts
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.full != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      CARGO_BUILD_JOBS: 2
      TEMP: ${{ github.workspace }}/.codex-runtime/temp
      TMP: ${{ github.workspace }}/.codex-runtime/temp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .codex-runtime/cargo-home/registry
            .codex-runtime/cargo-home/git
            target/debug
          key: native-unit-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/*/Cargo.toml', 'apps/export-doc-server/Cargo.toml', 'apps/export-doc-tauri/src-tauri/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            native-unit-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/*/Cargo.toml', 'apps/export-doc-server/Cargo.toml', 'apps/export-doc-tauri/src-tauri/Cargo.toml') }}-
      - uses: ./.github/actions/prepare-web
      - name: Check Rust formatting
        run: cargo fmt --all --check
      # Integration/doc tests and all-features checks run once in the full matrix.
      - name: Test backend units
        run: cargo test --locked --workspace --exclude export-doc-tauri --lib
      - name: Test changed desktop host
        if: needs.changes.outputs.desktop == 'true'
        run: cargo test --locked -p export-doc-tauri
      - name: Check shared desktop composition
        if: needs.changes.outputs.desktopCheck == 'true' && needs.changes.outputs.desktop != 'true'
        run: cargo check --locked -p export-doc-tauri
      - name: Test changed OCR worker
        if: needs.changes.outputs.ocr == 'true'
        run: cargo test --locked --manifest-path apps/exportdoc-ocr-rs/Cargo.toml
      - name: Verify generated API contract
        run: cargo run --locked -p export-doc-contracts --example generate_clients -- --check
  frontend-quality:
    name: Frontend build and layout quality
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright-browsers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json
      - uses: ./.github/actions/prepare-web
        with:
          chromium: 'true'
      - run: npm --prefix apps/export-doc-web run build
      - run: npm --prefix apps/export-doc-web run test:style-governance
      - run: npm --prefix apps/export-doc-web run test:accessibility-contracts
      - run: npm --prefix apps/export-doc-web run test:permission-contracts
      - run: npm --prefix apps/export-doc-web run test:scale-contracts
      - run: npm --prefix apps/export-doc-web run test:visual-baselines
      - name: Upload failed visual evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-visual-failure
          path: artifacts/frontend-visual-baseline
          if-no-files-found: ignore
          retention-days: 7
  frontend-regressions:
    name: Chromium editing and async regressions
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright-browsers
      TEMP: ${{ github.workspace }}/.codex-runtime/temp
      TMP: ${{ github.workspace }}/.codex-runtime/temp
      TMPDIR: ${{ github.workspace }}/.codex-runtime/temp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json
      - uses: ./.github/actions/prepare-web
        with:
          chromium: 'true'
      - name: Validate editing, cancellation and request contracts
        run: |
          npm --prefix apps/export-doc-web run test:font-build
          npm --prefix apps/export-doc-web run test:invoice-editing
          npm --prefix apps/export-doc-web run test:document-editor-ui
          npm --prefix apps/export-doc-web run test:input-method-ui
          npm --prefix apps/export-doc-web run test:report-designer-v3
          npm --prefix apps/export-doc-web run test:abortable-operations-ui
          npm --prefix apps/export-doc-web run test:email-template-workspace-ui
          npm --prefix apps/export-doc-web run test:concurrency-feedback
          npm --prefix apps/export-doc-web run test:browser-session-contracts

  full-validation:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/native-full-validation.yml
