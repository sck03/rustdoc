name: Dependency security and SBOM governance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"
    - cron: "23 2 * * 0,2-6"
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "eng/native-runtime-packages.json"
      - "Resources/Fonts/OpenSource/**"
      - "OcrModels/**"
      - "VisualCppRuntime/**"
      - "WebView2Runtime/**"
      - "third_party/**"
      - "THIRD_PARTY_*.md"
      - "scripts/generate-dependency-governance.mjs"
      - "scripts/verify-dependency-policy.mjs"
      - "scripts/test_dependency_policy.mjs"
      - "scripts/test_dependency_audit.mjs"
      - "scripts/lib/dependency-audit.mjs"
      - "scripts/lib/cargo-paths.mjs"
      - "scripts/test_cargo_paths.mjs"
      - "scripts/audit-npm-production.mjs"
      - ".github/dependabot.yml"
      - "scripts/verify-github-workflow-actions.mjs"
      - ".github/actions/**"
      - "scripts/verify-font-license-policy.mjs"
      - ".github/workflows/dependency-governance.yml"
      - "scripts/verify-rustsec-glib-exception.mjs"
      - "scripts/summarize-rustsec-reports.mjs"
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "eng/native-runtime-packages.json"
      - "Resources/Fonts/OpenSource/**"
      - "OcrModels/**"
      - "VisualCppRuntime/**"
      - "WebView2Runtime/**"
      - "third_party/**"
      - "THIRD_PARTY_*.md"
      - "scripts/generate-dependency-governance.mjs"
      - "scripts/verify-dependency-policy.mjs"
      - "scripts/test_dependency_policy.mjs"
      - "scripts/test_dependency_audit.mjs"
      - "scripts/lib/dependency-audit.mjs"
      - "scripts/lib/cargo-paths.mjs"
      - "scripts/test_cargo_paths.mjs"
      - "scripts/audit-npm-production.mjs"
      - ".github/dependabot.yml"
      - "scripts/verify-github-workflow-actions.mjs"
      - ".github/actions/**"
      - "scripts/verify-font-license-policy.mjs"
      - ".github/workflows/dependency-governance.yml"
      - "scripts/verify-rustsec-glib-exception.mjs"
      - "scripts/summarize-rustsec-reports.mjs"

concurrency:
  group: dependency-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-and-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      FULL_GOVERNANCE: ${{ github.event_name != 'schedule' || github.event.schedule == '23 2 * * 1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            apps/export-doc-web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.99.1

      - uses: ./.github/actions/prepare-web
        if: env.FULL_GOVERNANCE == 'true'

      - name: Restore Cargo source cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: dependency-sources-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore locked dependency graphs
        id: restore
        run: |
          cargo fetch --locked
          if [ "$FULL_GOVERNANCE" = "true" ]; then
            npm ci --prefix apps/export-doc-tauri
            cargo fetch --locked --manifest-path apps/exportdoc-ocr-rs/Cargo.toml
            cargo fetch --locked --manifest-path tools/excel-analyzer-rs/Cargo.toml
          fi

      - name: Validate Node 26 and artifact Action policy
        run: node scripts/verify-github-workflow-actions.mjs

      - name: Verify active source and dependency boundaries
        if: env.FULL_GOVERNANCE == 'true'
        run: node scripts/verify-dependency-policy.mjs

      - name: Run dependency policy regression tests
        if: env.FULL_GOVERNANCE == 'true'
        run: |
          node scripts/test_dependency_policy.mjs
          node scripts/test_dependency_audit.mjs

      - name: Audit npm production dependencies
        run: |
          node scripts/audit-npm-production.mjs apps/export-doc-web
          node scripts/audit-npm-production.mjs apps/export-doc-tauri

      - name: Restore reviewed RustSec tool
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.codex-runtime/cargo-audit
          key: cargo-audit-0.23.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install RustSec cargo-audit
        run: |
          tool="$GITHUB_WORKSPACE/.codex-runtime/cargo-audit"
          if [ ! -x "$tool/bin/cargo-audit" ] || [ "$("$tool/bin/cargo-audit" --version)" != "cargo-audit 0.23.0" ]; then
            cargo install cargo-audit --version 0.23.0 --locked --root "$tool" --force
          fi
          echo "$tool/bin" >> "$GITHUB_PATH"

      - name: Audit Rust lock files
        run: |
          mkdir -p artifacts/dependency-governance
          node scripts/verify-rustsec-glib-exception.mjs
          status=0
          "$GITHUB_WORKSPACE/.codex-runtime/cargo-audit/bin/cargo-audit" audit --deny unsound --deny yanked --ignore RUSTSEC-2024-0429 --file Cargo.lock --json > artifacts/dependency-governance/rustsec-workspace.json || status=1
          "$GITHUB_WORKSPACE/.codex-runtime/cargo-audit/bin/cargo-audit" audit --deny unsound --deny yanked --file apps/exportdoc-ocr-rs/Cargo.lock --json > artifacts/dependency-governance/rustsec-ocr.json || status=1
          "$GITHUB_WORKSPACE/.codex-runtime/cargo-audit/bin/cargo-audit" audit --deny unsound --deny yanked --file tools/excel-analyzer-rs/Cargo.lock --json > artifacts/dependency-governance/rustsec-excel.json || status=1
          node scripts/summarize-rustsec-reports.mjs artifacts/dependency-governance/rustsec-{workspace,ocr,excel}.json
          exit "$status"

      - name: Generate SPDX, CycloneDX and third-party inventory
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && env.FULL_GOVERNANCE == 'true' }}
        run: node scripts/generate-dependency-governance.mjs artifacts/dependency-governance --release --verify-repository

      - name: Recheck generated dependency evidence
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && env.FULL_GOVERNANCE == 'true' }}
        run: node scripts/verify-dependency-policy.mjs --generated-only

      - name: Upload dependency governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-governance
          path: artifacts/dependency-governance
          if-no-files-found: warn
          retention-days: 30
