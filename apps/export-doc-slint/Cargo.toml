[package]
name = "export-doc-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Slint native desktop front end for ExportDocManager"
build = "build.rs"

[dependencies]
export-doc-engine = { path = "../../crates/export-doc-engine", features = ["excel", "invoice-transfer", "exchange-rates", "hs-remote", "mail", "ocr", "ai", "single-window"] }
export-doc-mail = { path = "../../crates/export-doc-mail" }
export-doc-domain = { path = "../../crates/export-doc-domain" }
export-doc-contracts = { path = "../../crates/export-doc-contracts" }
slint = { version = "=1.18.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06", "compat-1-2"] }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
image = { workspace = true, features = ["bmp", "tiff", "webp"] }
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
chrono.workspace = true
rfd.workspace = true
copypasta = { version = "=0.10.2" }

[build-dependencies]
slint-build = "=1.18.0"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "=0.6.2"

[lints]
workspace = true
