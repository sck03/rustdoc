name: Browser compatibility acceptance

on:
  workflow_dispatch:

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firefox-webkit:
    name: Firefox + WebKit desktop/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target-native
      npm_config_cache: ${{ github.workspace }}/.codex-runtime/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/export-doc-web/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.1

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/ExportDocManager.Api/packages.lock.json') }}-firefox-webkit

      - name: Install frontend dependencies
        run: npm ci --prefix apps/export-doc-web

      - name: Build frontend and API
        shell: pwsh
        run: |
          npm --prefix apps/export-doc-web run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p export-doc-server
          exit $LASTEXITCODE

      - name: Install Firefox and WebKit runtimes
        shell: pwsh
        run: |
          npm --prefix apps/export-doc-web exec playwright install-deps firefox webkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ steps.playwright-cache.outputs.cache-hit }}" -ne "true") {
            npm --prefix apps/export-doc-web exec playwright install firefox webkit
          }
          exit $LASTEXITCODE

      - name: Run real browser accessibility and responsive acceptance
        timeout-minutes: 25
        run: npm --prefix apps/export-doc-web run test:cross-browser-ui
