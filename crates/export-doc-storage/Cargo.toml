[package]
name = "export-doc-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Transactional SQLite and PostgreSQL adapters independent of UI and business rules"

[features]
default = []
postgres = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]

[dependencies]
serde_json.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
postgres = { version = "=0.19.14", optional = true }
postgres-native-tls = { version = "=0.5.3", optional = true }
native-tls = { version = "=0.2.18", optional = true }
[lints]
workspace = true
