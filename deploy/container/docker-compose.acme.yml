services:
  web:
    command:
      - /bin/sh
      - -c
      - >-
        (while :; do sleep 3600; nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    ports:
      - "${EXPORTDOCMANAGER_HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx.acme.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/letsencrypt:/etc/letsencrypt:ro
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/acme-webroot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet || true;
          sleep 43200;
        done
    depends_on:
      web:
        condition: service_started
    volumes:
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/letsencrypt:/etc/letsencrypt
      - ${EXPORTDOCMANAGER_RUNTIME_ROOT:-./runtime}/acme-webroot:/var/www/certbot
