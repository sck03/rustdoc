[package]
name = "export-doc-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Transactional SQLite and PostgreSQL adapters independent of UI and business rules"

[features]
default = []
postgres = ["dep:tokio-postgres", "dep:tokio", "dep:postgres-native-tls", "dep:native-tls"]

[dependencies]
serde_json.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup", "cache", "functions", "hooks"] }
unicode-normalization.workspace = true
chrono.workspace = true
sha2.workspace = true
tokio-postgres = { version = "=0.7.18", optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net", "time", "macros"] }
postgres-native-tls = { version = "=0.5.3", optional = true }
native-tls = { version = "=0.2.18", optional = true }
[dev-dependencies]
postgres = "=0.19.14"

[lints]
workspace = true
