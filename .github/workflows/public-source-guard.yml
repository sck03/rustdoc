name: Public source guard

on:
  workflow_dispatch:

concurrency:
  group: public-source-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Verify public repository boundary
        shell: pwsh
        run: ./scripts/github/verify-public-source.ps1

      - name: Verify GitHub Action runtime policy
        run: node scripts/verify-github-workflow-actions.mjs

      - name: Verify updater release trust contract
        run: node scripts/test_tauri_updater_release_contract.mjs
