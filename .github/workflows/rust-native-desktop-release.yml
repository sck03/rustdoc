name: Rust native desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-native-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
    env:
      CARGO_HOME: ${{ github.workspace }}/.codex-runtime/cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.codex-runtime/rustup-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.codex-runtime/cargo-target-native
      CARGO_BUILD_JOBS: 2
      TMPDIR: ${{ github.workspace }}/.codex-runtime/temp
      TEMP: ${{ github.workspace }}/.codex-runtime/temp
      TMP: ${{ github.workspace }}/.codex-runtime/temp
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare workspace runtime directories
        shell: pwsh
        run: |
          @($env:CARGO_HOME, $env:RUSTUP_HOME, $env:CARGO_TARGET_DIR, $env:TEMP) |
            ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Restore Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .codex-runtime/cargo-home/registry
            .codex-runtime/cargo-home/git
          key: native-desktop-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Verify native desktop dependency boundaries
        run: node scripts/verify-native-desktop.mjs --target ${{ matrix.target }}
      - name: Build green desktop package
        shell: pwsh
        run: ./scripts/build-native.ps1 -NoPause -WithoutOcr -RustTarget ${{ matrix.target }}
      - name: Normalize package directory name
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'artifacts/native-desktop/ExportDocManager.Slint'
          $target = Join-Path $env:GITHUB_WORKSPACE 'artifacts/native-desktop/exportdoc-native-desktop-${{ matrix.artifact }}'
          Move-Item -LiteralPath $source -Destination $target -Force
      - name: Upload green desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exportdoc-native-desktop-${{ matrix.artifact }}
          path: artifacts/native-desktop/exportdoc-native-desktop-${{ matrix.artifact }}
          if-no-files-found: error
